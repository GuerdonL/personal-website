name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html
        run: python3 build.py

      - name: Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: panels

      - name: Install wasm-bindgen CLI
        run: |
          V=$(grep -oP 'wasm-bindgen = "=\K[0-9.]+' panels/Cargo.toml)
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${V}/wasm-bindgen-${V}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-${V}-x86_64-unknown-linux-musl/wasm-bindgen"
          wasm-bindgen --version

      - name: Build panels (Rust → wasm)
        working-directory: panels
        run: |
          cargo test --release
          cargo build --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/pkg --no-typescript \
            target/wasm32-unknown-unknown/release/panels.wasm
          ls -la web/pkg

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' --exclude 'panels' --exclude '.github' . _site/
          rsync -a panels/web/ _site/panels/
          find _site/panels -type f | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
