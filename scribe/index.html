<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Scribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9; --t0: #ffffff; --t1: #f5f5f4;
    --line: #e7e5e4; --line-strong: #a8a29e;
    --ink: #292524; --faint: #a8a29e; --accent: #57534e;
    --sel: #2563eb; --ok: #16a34a; --warn: #b45309;
    --inkpen: #1c1917; --fit: #2563eb; --ghost: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --t0: #292524; --t1: #221f1d;
      --line: #3a3532; --line-strong: #78716c;
      --ink: #e7e5e4; --faint: #78716c; --accent: #d6d3d1;
      --sel: #60a5fa; --ok: #4ade80; --warn: #fbbf24;
      --inkpen: #f5f5f4; --fit: #60a5fa; --ghost: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.35 Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  #top { flex: none; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; border-bottom: 1px solid var(--line); background: var(--t0); }
  #sample { font: 400 clamp(20px, 3.2vw, 30px)/1.25 Newsreader, Georgia, serif; letter-spacing: .005em; margin: 2px 0 8px; min-height: 1.3em; }
  #sample .sel { cursor: text; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--accent); }
  #bar .grp { display: flex; gap: 6px; align-items: center; }
  .btn { padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--t0); color: var(--ink); font-size: 12.5px; }
  .btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  label.tg { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  label.tg input { margin: 0; accent-color: var(--sel); }
  #tidy { width: 90px; accent-color: var(--ink); margin: 0 4px; }

  #stage { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: crosshair; }

  #status { flex: none; display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font: 11.5px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); background: var(--t0); }
  #status b { color: var(--accent); font-weight: 500; }
  #hint { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); color: var(--faint); font-size: 13px; text-align: center; pointer-events: none; max-width: 36em; line-height: 1.5; }
  #hint kbd { font: 11px 'JetBrains Mono', monospace; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div id="top">
  <div id="sample"><span class="sel" id="sampleText" title="Click to type your own text"></span></div>
  <div id="bar">
    <div class="grp">
      <button class="btn pri" id="bFit">Fit</button>
      <button class="btn" id="bUndo">Undo</button>
      <button class="btn" id="bClear">Clear</button>
      <button class="btn" id="bNext">New text</button>
    </div>
    <div class="grp">
      tidy <input type="range" id="tidy" min="0" max="100" value="35"> <span id="tidyV">0.35</span>
    </div>
    <div class="grp">
      <label class="tg"><input type="checkbox" id="sInk" checked> ink</label>
      <label class="tg"><input type="checkbox" id="sFit" checked> fit</label>
      <label class="tg"><input type="checkbox" id="sGhost"> ideal</label>
      <label class="tg"><input type="checkbox" id="sBoxes"> boxes</label>
    </div>
    <div class="grp">
      <label class="tg"><input type="checkbox" id="sPen" checked> pen only</label>
      <label class="tg"><input type="checkbox" id="sLearn" checked> learn</label>
      <label class="tg"><input type="checkbox" id="sPersonal" checked> my alphabet</label>
    </div>
    <div class="grp">
      <button class="btn" id="bExport">Export</button>
      <button class="btn" id="bForget">Forget</button>
    </div>
  </div>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">Write the sentence above anywhere on this page — any size, any number of lines, joined letters are fine.<br>Then press <kbd>Fit</kbd> (or <kbd>Enter</kbd>). <kbd>⌘Z</kbd> undoes a stroke.</div>
</div>
<div id="status">
  <span>strokes <b id="stStrokes">0</b></span>
  <span>lines <b id="stLines">–</b></span>
  <span>x-height <b id="stXh">–</b></span>
  <span>fit <b id="stScore">–</b></span>
  <span>learned <b id="stLearn">–</b></span>
  <span id="stMsg"></span>
</div>

<script src="alphabet.js"></script>
<script>
(() => {
'use strict';
const { GLYPHS, SPACE_ADV, ASC, DESC } = window.ALPHABET;

/* =========================================================================
   0. sample texts
   ========================================================================= */
const SAMPLES = [
  'the quick brown fox jumps over the lazy dog',
  'pack my box with five dozen liquor jugs',
  'how vexingly quick daft zebras jump',
  'sphinx of black quartz, judge my vow',
  'a gentle rain settled over the harbor town',
  'we met under the old bridge at dawn',
  'she folded the map and kept walking north',
  'Remember to water the lemon tree on Sunday',
  'The train left Logan Square before sunrise',
  'bring extra rope, two lamps and the long ladder',
  'nothing is so common as the wish to be remarkable',
  'every path through the hills ends at the same river',
  'My neighbor keeps bees behind the garage',
  'quiet mornings make for honest writing',
  'the ink dried slowly in the cold room',
  'Ask Jenny about the broken kiln on Friday',
];

/* =========================================================================
   1. persistent state
   ========================================================================= */
const LS_SET = 'scribe.v1.settings', LS_ALPHA = 'scribe.v1.alphabet', LS_SAMPLES = 'scribe.v1.samples';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const settings = Object.assign({ tidy: 0.35, ink: true, fit: true, ghost: false, boxes: false, pen: true, learn: true, personal: true, sampleIdx: 0 }, load(LS_SET, {}));
let personal = load(LS_ALPHA, {});   // char → { n, pts:[[x,y]...] (sum of normalized control points), adv (sum) }
let samples = load(LS_SAMPLES, []);

/* =========================================================================
   2. canvas + ink capture
   ========================================================================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
let W = 0, H = 0, DPR = 1;
let strokes = [];      // {pts:[{x,y,p}]}
let redo = [];
let live = null;       // stroke being drawn
let fitResult = null;  // output of runFit
let text = '';

function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  render();
}
window.addEventListener('resize', resize);

const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'mouse' ? 0.5 : (e.pressure || 0.5) }; };

/* ---- palm rejection ----
   1. The browser must never see a finger/palm as a gesture: touch events on the page
      are swallowed (non-passive preventDefault), otherwise iPadOS/Android cancel the
      pen pointer the moment the heel of your hand lands.
   2. While a pen is down, or for PEN_GRACE ms after it lifts, touch pointers are ignored
      outright (even with "pen only" off).
   3. A touch contact with a big footprint (width/height) is a palm, never a pen tip.
   4. If a pen stroke starts while a touch stroke is live, the touch stroke was the palm:
      it is discarded and the pen takes over. Touch strokes committed in the last
      PALM_LOOKBACK ms are also removed when the pen starts.
   5. Only one pointer draws at a time; a second simultaneous contact never starts a stroke. */
const PEN_GRACE = 1500, PALM_LOOKBACK = 700, PALM_SIZE = 22;
let lastPen = -Infinity;          // time the pen was last seen
for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel'])
  document.addEventListener(ev, e => { if (e.target === cv || live || performance.now() - lastPen < PEN_GRACE) e.preventDefault(); }, { passive: false });
cv.addEventListener('gesturestart', e => e.preventDefault());
cv.addEventListener('gesturechange', e => e.preventDefault());

function isPalm(e) {
  if (e.pointerType !== 'touch') return false;
  if (settings.pen) return true;
  if (performance.now() - lastPen < PEN_GRACE) return true;
  if (Math.max(e.width || 0, e.height || 0) > PALM_SIZE) return true;
  return false;
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen') lastPen = performance.now();
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (isPalm(e)) return;
  if (live) {
    // a pen arriving on top of a live touch stroke means the touch was the palm
    if (e.pointerType === 'pen' && live.type === 'touch') { try { cv.releasePointerCapture(live.id); } catch {} live = null; }
    else return;                                   // never draw with two pointers at once
  }
  if (e.pointerType === 'pen') {
    // palm contacts usually land a beat before the pen: drop very recent touch strokes
    const cut = performance.now() - PALM_LOOKBACK; let n = strokes.length;
    strokes = strokes.filter(s => !(s.src === 'touch' && s.t > cut)); if (strokes.length !== n) stat('stStrokes', strokes.length);
  }
  try { cv.setPointerCapture(e.pointerId); } catch {}
  live = { pts: [pos(e)], id: e.pointerId, type: e.pointerType, t0: performance.now() };
  fitResult = null; hint.style.display = 'none';
  render();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'pen') lastPen = performance.now();
  if (!live || e.pointerId !== live.id) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null; if (!evs || !evs.length) evs = [e];
  for (const ev of evs) {
    const p = pos(ev), q = live.pts[live.pts.length - 1];
    if (Math.hypot(p.x - q.x, p.y - q.y) >= 0.7) live.pts.push(p);
  }
  renderLive();
});
const endStroke = e => {
  if (e.pointerType === 'pen') lastPen = performance.now();
  if (!live || e.pointerId !== live.id) return;
  const s = live; live = null;
  // a touch "stroke" that barely moved is a resting finger, not ink
  if (s.type === 'touch' && s.pts.length < 4) { render(); return; }
  if (s.pts.length === 1) s.pts.push({ ...s.pts[0], x: s.pts[0].x + 0.5 });
  strokes.push({ pts: s.pts, src: s.type, t: performance.now() }); redo = [];
  stat('stStrokes', strokes.length); render();
};
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);
cv.addEventListener('lostpointercapture', e => { if (live && e.pointerId === live.id) endStroke(e); });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================================
   3. geometry helpers
   ========================================================================= */
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length & 1 ? s[m] : (s[m - 1] + s[m]) / 2; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const bez = (P, i, t) => { // point on cubic P[i..i+3]
  const u = 1 - t, b0 = u * u * u, b1 = 3 * u * u * t, b2 = 3 * u * t * t, b3 = t * t * t;
  return { x: b0 * P[i].x + b1 * P[i + 1].x + b2 * P[i + 2].x + b3 * P[i + 3].x,
           y: b0 * P[i].y + b1 * P[i + 1].y + b2 * P[i + 2].y + b3 * P[i + 3].y, b: [b0, b1, b2, b3] };
};
// resample a polyline at ~step spacing
function resample(pts, step) {
  const out = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = pts[i - 1], b = pts[i]; let d = Math.hypot(b.x - a.x, b.y - a.y);
    while (acc + d >= step) {
      const t = (step - acc) / d; a = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; out.push(a);
      d = Math.hypot(b.x - a.x, b.y - a.y); acc = 0;
    }
    acc += d;
  }
  return out;
}
// uniform grid for nearest-neighbour queries over ink points
function makeGrid(pts, cell) {
  const m = new Map(); const key = (i, j) => i * 73856093 ^ j * 19349663;
  for (const p of pts) { const k = key(Math.floor(p.x / cell), Math.floor(p.y / cell)); (m.get(k) || m.set(k, []).get(k)).push(p); }
  return { cell, m, key, nearest(x, y, maxD, xlo = -Infinity, xhi = Infinity) {
    const ci = Math.floor(x / cell), cj = Math.floor(y / cell), R = Math.ceil(maxD / cell);
    let best = null, bd = maxD * maxD;
    for (let i = ci - R; i <= ci + R; i++) for (let j = cj - R; j <= cj + R; j++) {
      const b = m.get(key(i, j)); if (!b) continue;
      for (const p of b) { if (p.x < xlo || p.x > xhi) continue; const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = p; } }
    }
    return best;
  } };
}

/* =========================================================================
   4. ink → lines (reading order top→bottom, left→right)
   ========================================================================= */
function strokeBox(s) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of s.pts) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, yc: (y0 + y1) / 2 };
}
function segmentLines(strokes) {
  const S = strokes.map(s => ({ s, b: strokeBox(s) })).sort((a, b) => a.b.yc - b.b.yc);
  // typical "tall" stroke height: 80th percentile, so dots and crosses don't drag it down
  const hs = S.map(o => o.b.h).sort((a, b) => a - b); const Hm = Math.max(8, 0.8 * hs[Math.min(hs.length - 1, Math.floor(hs.length * 0.8))]);
  let lines = []; let cur = null;
  for (const o of S) {
    if (!cur || o.b.yc - cur.lastYc > 0.9 * Hm) { cur = { strokes: [], lastYc: o.b.yc, y0: o.b.y0, y1: o.b.y1 }; lines.push(cur); }
    cur.strokes.push(o.s); cur.lastYc = Math.max(cur.lastYc, o.b.yc); cur.y0 = Math.min(cur.y0, o.b.y0); cur.y1 = Math.max(cur.y1, o.b.y1);
  }
  // a cluster made only of small marks (stray i-dots, t-crosses) joins its nearest real line
  const Hl = median(lines.map(L => L.y1 - L.y0));
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i]; if (L.y1 - L.y0 >= 0.45 * Hl || lines.length < 2) continue;
    const cand = [lines[i - 1], lines[i + 1]].filter(Boolean).map(M => ({ M, d: Math.min(Math.abs(M.y0 - L.y1), Math.abs(L.y0 - M.y1), Math.abs((M.y0 + M.y1) / 2 - (L.y0 + L.y1) / 2)) })).sort((a, b) => a.d - b.d)[0];
    if (cand && cand.d < 2.5 * (cand.M.y1 - cand.M.y0)) { cand.M.strokes.push(...L.strokes); cand.M.y0 = Math.min(cand.M.y0, L.y0); cand.M.y1 = Math.max(cand.M.y1, L.y1); lines.splice(i, 1); i--; }
  }
  for (const L of lines) lineMetrics(L);
  return lines.filter(L => L.cols > 0);
}
function lineMetrics(L) {
  const pts = []; for (const s of L.strokes) for (const p of resample(s.pts, 2)) pts.push(p);
  L.pts = pts;
  let x0 = Infinity, x1 = -Infinity; for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; }
  L.x0 = Math.floor(x0); L.x1 = Math.ceil(x1); const n = L.x1 - L.x0 + 1;
  const top = new Float32Array(n).fill(Infinity), bot = new Float32Array(n).fill(-Infinity), cov = new Float32Array(n);
  for (const p of pts) { const i = Math.round(p.x) - L.x0; if (p.y < top[i]) top[i] = p.y; if (p.y > bot[i]) bot[i] = p.y; cov[i]++; }
  const tops = [], bots = []; let cols = 0;
  for (let i = 0; i < n; i++) if (cov[i]) { cols++; tops.push(top[i]); bots.push(bot[i]); }
  L.cols = cols; L.cov = cov; L.top = top; L.bot = bot;
  // Baseline / x-height from the vertical ink-density profile: the x-height band
  // holds most of the ink, ascenders and descenders are sparse. Walk out from the
  // density peak until it falls below a fraction of the peak.
  let y0 = Infinity, y1 = -Infinity; for (const p of pts) { if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
  const yb = Math.floor(y0) - 2, ny = Math.ceil(y1) - yb + 3; const hist = new Float32Array(ny);
  for (const p of pts) hist[Math.round(p.y) - yb]++;
  const sm = new Float32Array(ny); const R = Math.max(2, Math.round((y1 - y0) * 0.04));
  for (let i = 0; i < ny; i++) { let s = 0, n = 0; for (let k = -R; k <= R; k++) { const j = i + k; if (j >= 0 && j < ny) { s += hist[j]; n++; } } sm[i] = s / n; }
  let pk = 0; for (let i = 1; i < ny; i++) if (sm[i] > sm[pk]) pk = i;
  const thr = 0.42 * sm[pk]; let lo = pk, hi = pk;
  while (lo > 0 && sm[lo - 1] > thr) lo--; while (hi < ny - 1 && sm[hi + 1] > thr) hi++;
  L.xtop = yb + lo; L.baseline = yb + hi;
  if (L.baseline - L.xtop < 6) { L.baseline = median(bots); L.xtop = median(tops); }   // degenerate (e.g. a single dash)
  if (L.baseline - L.xtop < 6) { L.xtop = L.baseline - 6; }
  L.xh = L.baseline - L.xtop;
  L.width = L.x1 - L.x0;
  L.grid = makeGrid(pts, Math.max(6, L.xh * 0.5));
}

/* =========================================================================
   5. text → words → lines → characters (forced alignment by expected width)
   ========================================================================= */
function glyphFor(ch) { return GLYPHS[ch] || GLYPHS[ch.toLowerCase()] || null; }
function advOf(ch) {
  const g = glyphFor(ch); const base = g ? g.adv : 1.0;
  const p = personal[ch]; if (settings.personal && p && p.n >= 2) return 0.5 * base + 0.5 * (p.adv / p.n);
  return base;
}
function wordUnits(w) { let u = 0; for (const ch of w) u += advOf(ch); return u; }

// which words go on which ink line: contiguous partition minimising squared width mismatch
function allocateWords(lines, words) {
  const L = lines.length, Wn = words.length;
  const U = lines.map(l => l.width / l.xh), u = words.map(wordUnits);
  const pre = [0]; for (const x of u) pre.push(pre[pre.length - 1] + x);
  const span = (j, k) => k > j ? pre[k] - pre[j] + SPACE_ADV * (k - j - 1) : 0;
  const memo = new Map(); const choice = new Map();
  const f = (i, j) => { // cost of lines i.. given words j.. remain
    if (i === L) return j === Wn ? 0 : 1e9;
    const key = i * (Wn + 1) + j; if (memo.has(key)) return memo.get(key);
    let best = Infinity, bk = j;
    const kmax = i === L - 1 ? Wn : Wn;
    for (let k = (i === L - 1 ? Wn : j); k <= kmax; k++) {
      const empty = k === j;
      const c = (empty ? U[i] * U[i] + 4 : (U[i] - span(j, k)) ** 2) + f(i + 1, k);
      if (c < best) { best = c; bk = k; }
      if (i === L - 1) break;
    }
    memo.set(key, best); choice.set(key, bk); return best;
  };
  f(0, 0);
  const out = []; let j = 0;
  for (let i = 0; i < L; i++) { const k = choice.get(i * (Wn + 1) + j); out.push(words.slice(j, k)); j = k; }
  return out;
}

// within an ink line, split its extent into word spans using blank columns
function splitWords(line, words) {
  const n = words.length; const res = [];
  if (n === 0) return res;
  const units = words.map(wordUnits), total = units.reduce((a, b) => a + b, 0) + SPACE_ADV * (n - 1);
  const px = line.width / total;
  // expected boundaries (centre of each inter-word space)
  const exp = []; let acc = 0;
  for (let i = 0; i < n - 1; i++) { acc += units[i]; exp.push(line.x0 + (acc + SPACE_ADV / 2) * px); acc += SPACE_ADV; }
  // candidate gaps: runs of empty columns strictly inside the ink
  const gaps = []; let run = 0;
  for (let i = 0; i <= line.cov.length; i++) {
    if (i < line.cov.length && line.cov[i] === 0) run++;
    else { if (run >= 2 && i - run > 0 && i < line.cov.length) gaps.push({ c: line.x0 + i - run / 2, len: run }); run = 0; }
  }
  let bounds;
  if (n === 1) bounds = [];
  else if (gaps.length >= n - 1) {
    // DP: assign boundaries to gaps monotonically, rewarding long gaps near their expected spot
    const G = gaps.length, cost = (m, g) => Math.abs(gaps[g].c - exp[m]) / line.xh - Math.min(gaps[g].len / line.xh, 1.5) * 1.2;

  if (settings.ink || !haveFit) for (const s of strokes) drawStroke(s, haveFit ? 0.28 : 0.92);
  if (!haveFit) return;
  const t = settings.tidy;
  for (const Lr of fitResult.lines) {
    if (settings.boxes) {
      ctx.save(); ctx.strokeStyle = css('--faint'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.moveTo(Lr.line.x0, Lr.line.baseline); ctx.lineTo(Lr.line.x1, Lr.line.baseline); ctx.moveTo(Lr.line.x0, Lr.line.xtop); ctx.lineTo(Lr.line.x1, Lr.line.xtop); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 0.35;
      for (const w of Lr.wins) { ctx.strokeRect(w.x0, Lr.line.xtop - 0.95 * Lr.line.xh, w.x1 - w.x0, Lr.line.xh * (1.95 + 1.0)); }
      ctx.restore();
      ctx.save(); ctx.fillStyle = css('--faint'); ctx.font = `${Math.max(9, Math.min(12, Lr.line.xh * 0.5))}px JetBrains Mono, monospace`; ctx.textAlign = 'center';
      for (const w of Lr.wins) ctx.fillText(w.ch, (w.x0 + w.x1) / 2, Lr.line.baseline + Lr.line.xh * 1.25 + 10); ctx.restore();
    }
    if (settings.ghost) { ctx.save(); ctx.strokeStyle = css('--ghost'); ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55; ctx.setLineDash([4, 3]); ctx.beginPath(); for (const G of Lr.glyphs) for (const P of G.ideal) pathOf(P); ctx.stroke(); ctx.restore(); }
    if (settings.fit) { ctx.save(); ctx.strokeStyle = css('--fit'); ctx.lineWidth = Math.max(1.4, Math.min(2.6, Lr.line.xh * 0.07)); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); for (const G of Lr.glyphs) for (const P of blended(G, t)) pathOf(P); ctx.stroke(); ctx.restore(); }
  }
}
function renderLive() { if (!live) return; render(); drawStroke(live, 0.92); }

/* =========================================================================
   11. UI wiring
   ========================================================================= */
const $ = id => document.getElementById(id);
const stat = (id, v) => { $(id).textContent = v; };
function setText(t) { text = t; $('sampleText').textContent = t; fitResult = null; render(); }
function nextText() { settings.sampleIdx = (settings.sampleIdx + 1) % SAMPLES.length; save(LS_SET, settings); setText(SAMPLES[settings.sampleIdx]); strokes = []; redo = []; stat('stStrokes', 0); hint.style.display = ''; }
function doFit() {
  if (!strokes.length) return;
  fitResult = runFit();
  if (!fitResult) return;
  stat('stLines', fitResult.lines.length);
  stat('stXh', fitResult.lines.map(l => Math.round(l.line.xh) + 'px').join(' '));
  stat('stScore', isFinite(fitResult.score) ? `${fitResult.scoreBefore.toFixed(2)} → ${fitResult.score.toFixed(2)} xh` : '–');
  let learned = 0; if (settings.learn) learned = learn(fitResult);
  stat('stLearn', learnedSummary());
  stat('stMsg', `${Math.round(fitResult.ms)} ms${learned ? ` · learned from ${learned} letters` : ''}`);
  // keep the sample for later offline work
  const ds = strokes.map(s => ({ pts: resample(s.pts, 2.5).map(p => [Math.round(p.x * 2) / 2, Math.round(p.y * 2) / 2]) }));
  samples.push({ ts: Date.now(), text, score: fitResult.score, w: W, h: H, strokes: ds }); if (samples.length > 30) samples.shift(); save(LS_SAMPLES, samples);
  render();
}
$('bFit').onclick = doFit;
$('bUndo').onclick = () => { if (strokes.length) { redo.push(strokes.pop()); fitResult = null; stat('stStrokes', strokes.length); render(); } };
$('bClear').onclick = () => { strokes = []; redo = []; fitResult = null; stat('stStrokes', 0); hint.style.display = ''; render(); };
$('bNext').onclick = nextText;
$('sampleText').onclick = () => { const t = prompt('Text to write:', text); if (t && t.trim()) { setText(t.trim()); strokes = []; stat('stStrokes', 0); render(); } };
$('tidy').oninput = e => { settings.tidy = e.target.value / 100; $('tidyV').textContent = settings.tidy.toFixed(2); save(LS_SET, settings); render(); };
for (const [id, k] of [['sInk', 'ink'], ['sFit', 'fit'], ['sGhost', 'ghost'], ['sBoxes', 'boxes'], ['sPen', 'pen'], ['sLearn', 'learn'], ['sPersonal', 'personal']]) {
  $(id).checked = settings[k]; $(id).onchange = e => { settings[k] = e.target.checked; save(LS_SET, settings); render(); };
}
$('bExport').onclick = () => {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), alphabet: personal, samples }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `scribe-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('bForget').onclick = () => { if (confirm('Forget everything learned about your hand, and the stored samples?')) { personal = {}; samples = []; save(LS_ALPHA, personal); save(LS_SAMPLES, samples); stat('stLearn', learnedSummary()); fitResult = null; render(); } };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) { if (redo.length) { strokes.push(redo.pop()); stat('stStrokes', strokes.length); render(); } } else $('bUndo').click(); }
  else if (e.key === 'Enter') { e.preventDefault(); doFit(); }
});
$('tidy').value = Math.round(settings.tidy * 100); $('tidyV').textContent = settings.tidy.toFixed(2);
setText(SAMPLES[settings.sampleIdx % SAMPLES.length]);
stat('stLearn', learnedSummary());
resize();

// exposed for tests / tinkering
window.SCRIBE = { get strokes() { return strokes; }, set strokes(v) { strokes = v; fitResult = null; stat('stStrokes', v.length); hint.style.display = v.length ? 'none' : ''; render(); }, setText, fit: doFit, get result() { return fitResult; }, personal: () => personal, runFit };
})();
</script>
</body>
