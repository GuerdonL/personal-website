<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9; --t0: #ffffff; --t1: #f5f5f4;
    --line: #e7e5e4; --line-strong: #a8a29e;
    --ink: #292524; --faint: #a8a29e; --accent: #57534e; --danger: #dc2626;
    --sel: #2563eb; --match: #ca8a04; --amber: #b45309; --orange: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --t0: #292524; --t1: #221f1d;
      --line: #3a3532; --line-strong: #78716c;
      --ink: #e7e5e4; --faint: #78716c; --accent: #d6d3d1; --danger: #f87171;
      --sel: #60a5fa; --match: #facc15; --amber: #fbbf24; --orange: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.35 Inter, system-ui, sans-serif; }

  #root { min-height: 100%; padding: 52px 24px 110px; cursor: cell; }
  /* Each container is a grid whose column count comes from squareCols(n).
     Columns are max-content, so a box is exactly as big as its arranged
     children — sizes resolve bottom-up, from leaves to the root. */
  .kids {
    display: grid; grid-template-columns: repeat(var(--cols, 1), max-content);
    align-items: start; justify-content: start; gap: 8px;
  }
  #root > .kids { gap: 12px; }

  .task {
    display: flex; flex-direction: column; gap: 7px;
    min-width: 56px; padding: 7px 11px 13px;
    background: var(--t0); border: 1px solid var(--line); border-radius: 7px;
    cursor: cell; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: border-color .12s;
  }
  .task.odd { background: var(--t1); }
  .task.match { box-shadow: inset 0 0 0 2px var(--match); }
  .task:not(.parent) > .kids:empty { display: none; }
  .task:hover:not(:has(.task:hover)) { border-color: var(--line-strong); }

  .head { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; cursor: default; }
  .head > .name + * { margin-left: auto; }
  .num { font: 10px/1 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); }

  .sel { outline: 2px solid var(--sel); outline-offset: 1px; }
  #root.sel { outline: 1px solid var(--sel); outline-offset: -6px; }

  input.edit {
    font: inherit; font-weight: 500; color: inherit; background: transparent;
    border: 0; border-bottom: 1px solid var(--line-strong); outline: none;
    padding: 0; min-width: 5ch; max-width: 100%; field-sizing: content;
  }
  .kids > input.edit { padding: 7px 11px; border: 1px dashed var(--line-strong); border-radius: 7px; background: var(--t0); }

  .dragging { opacity: .25; }
  .ghost {
    position: fixed; z-index: 10; margin: 0; pointer-events: none;
    max-height: 220px; overflow: hidden; opacity: .92;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .drop { outline: 2px dashed var(--accent); outline-offset: 1px; }
  #root.drop { outline-offset: -8px; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

  #archive {
    position: fixed; right: 22px; bottom: 74px; width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; color: var(--faint); opacity: .6; cursor: pointer;
    background: none; border: 0; border-radius: 50%;
    transition: transform .15s, color .15s, opacity .15s;
  }
  #archive:hover { opacity: 1; color: var(--ink); }
  #archive .count { position: absolute; top: 6px; right: 4px; font: 9px/1 'JetBrains Mono', ui-monospace, monospace; }
  body.is-dragging #archive { opacity: 1; color: var(--ink); transform: scale(1.15); }
  #archive.over { color: var(--sel); transform: scale(1.4) !important; }
  #apanel {
    position: fixed; right: 22px; bottom: 126px; z-index: 20; width: 280px; max-height: 55vh; overflow: auto;
    padding: 8px; background: var(--t0); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.16); font-size: 13px;
  }
  #apanel[hidden] { display: none; }
  #apanel .ttl { padding: 4px 6px 8px; color: var(--faint); font-size: 12px; }
  #apanel .row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; }
  #apanel .row:hover { background: var(--t1); }
  #apanel .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  #apanel .meta { font: 10px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); white-space: nowrap; }
  #apanel button { font: inherit; font-size: 12px; color: var(--faint); background: none; border: 0; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  #apanel button:hover { color: var(--ink); background: var(--line); }
  #apanel .empty { padding: 6px; color: var(--faint); }

  #trash {
    position: fixed; right: 22px; bottom: 22px; width: 44px; height: 44px;
    display: grid; place-items: center; color: var(--faint); opacity: .6;
    transition: transform .15s, color .15s, opacity .15s;
  }
  body.is-dragging #trash { opacity: 1; color: var(--ink); transform: scale(1.15); }
  #trash.over { color: var(--danger); transform: scale(1.4) !important; }

  #bar {
    position: fixed; left: 18px; bottom: 18px; display: flex; align-items: center;
    font: 13px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint);
  }
  #bar input { font: inherit; color: var(--ink); background: transparent; border: 0; outline: none; padding: 0; width: 40ch; }
  #cmd[hidden], #msg:empty { display: none; }
  #cmd { display: flex; color: var(--ink); }

  /* due dates: card colour is set inline from the fraction of time left */
  .due { font: 11px/1 'JetBrains Mono', ui-monospace, monospace; color: color-mix(in srgb, var(--ink) 65%, transparent); white-space: nowrap; }
  .due.over { color: var(--ink); font-weight: 600; }

  #sched {
    position: fixed; z-index: 20; width: 252px; padding: 12px;
    background: var(--t0); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.16); font-size: 13px;
  }
  #sched[hidden] { display: none; }
  #sched button, #sched select { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 6px; }
  #sched button:hover { background: var(--t1); }
  #sq {
    width: 100%; margin-bottom: 10px; padding: 6px 8px; font: 13px 'JetBrains Mono', ui-monospace, monospace;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none;
  }
  #sq:focus { border-color: var(--line-strong); }
  #sq.bad { border-color: var(--danger); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-weight: 500; }
  .cal-head button { width: 28px; height: 28px; font-size: 16px; }
  #sgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  #sgrid .wd { font-size: 11px; color: var(--faint); padding: 4px 0; }
  #sgrid button { height: 30px; }
  #sgrid button.today { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  #sgrid button.on { background: var(--sel); color: #fff; }
  .srow { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .srow select { border: 1px solid var(--line); padding: 3px 6px; background: var(--bg); }
  #ssave { font-weight: 500; padding: 4px 10px; }
  #sclear { color: var(--faint); padding: 4px 8px; }

  #hint { position: fixed; inset: 0; display: grid; place-items: center; color: var(--faint); pointer-events: none; }
  #hint[hidden] { display: none; }
  #crumbs { position: fixed; left: 18px; top: 14px; z-index: 5; font-size: 12px; color: var(--faint); max-width: calc(100vw - 120px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #crumbs a { color: inherit; text-decoration: none; }
  #crumbs a:hover { color: var(--ink); }
  #crumbs .sep { margin: 0 6px; opacity: .6; }
  #mode { position: fixed; right: 20px; top: 14px; font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--sel); }
  #mode:empty { display: none; }
  #root > .head { font-size: 20px; margin: -6px 0 16px; max-width: 900px; }
  #root > .head .name { font-weight: 600; }
  #root > .head > .name + * { margin-left: 4px; }
  #root > .head .due { font-size: 12px; }
  a.num { text-decoration: none; }
  a.num:hover { color: var(--sel); text-decoration: underline; }
</style>
</head>
<body>
<nav id="crumbs"></nav>
<div id="mode"></div>
<div id="root" data-id="root"><div class="kids"></div></div>
<div id="hint">click, or press o, to add a task</div>
<div id="bar">
  <form id="cmd" hidden><span id="cmdp">:</span><input id="cmdi" autocomplete="off" spellcheck="false"></form>
  <span id="msg"></span>
</div>
<div id="sched" hidden>
  <input id="sq" placeholder="mm/dd/yy hh:mm" autocomplete="off" spellcheck="false">
  <div class="cal-head"><button id="sprev" tabindex="-1">‹</button><span id="smonth"></span><button id="snext" tabindex="-1">›</button></div>
  <div id="sgrid"></div>
  <div class="srow">
    <span>repeat</span>
    <select id="srep">
      <option value="">never</option><option value="daily">daily</option><option value="weekdays">weekdays</option>
      <option value="weekly">weekly</option><option value="monthly">monthly</option><option value="yearly">yearly</option>
    </select>
  </div>
  <div class="srow"><button id="sclear">clear</button><button id="ssave">save</button></div>
</div>
<button id="archive" title="Archive — drag a task here, or press m+a">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/>
  </svg>
  <span class="count"></span>
</button>
<div id="apanel" hidden></div>
<div id="trash" title="Drag here to delete">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
  </svg>
</div>
<script>
(() => {
  const KEY = 'nested-tasks-v1';
  const rootEl = document.getElementById('root');
  const crumbsEl = document.getElementById('crumbs');
  const modeEl = document.getElementById('mode');
  const hintEl = document.getElementById('hint');
  const trashEl = document.getElementById('trash');
  const archiveEl = document.getElementById('archive');
  const apanel = document.getElementById('apanel');
  const cmdEl = document.getElementById('cmd');
  const cmdP = document.getElementById('cmdp');
  const cmdI = document.getElementById('cmdi');
  const msgEl = document.getElementById('msg');

  let data = load();
  let history = [];
  let editing = null;   // active <input>, if any
  let ptr = null;       // pointer gesture state
  let cursor = 'root';  // selected task id
  let zoom = 'root';    // task shown fullscreen (its children fill the page)
  let follow = false;   // F: keep zoom on the selected task's parent
  let query = null;     // last search string
  let highlight = false;

  // ── data ────────────────────────────────────────────────
  function load() {
    let d;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!d || !Array.isArray(d.children)) d = { id: 'root', children: [] };
    // give every task a permanent number (older saves had none)
    let max = 0;
    const all = bfs(d);
    all.forEach(t => { if (t.n) max = Math.max(max, t.n); });
    all.forEach(t => { if (!t.n) t.n = ++max; if (t.due && !t.set) t.set = Math.min(Date.now(), t.due); });
    d.next = Math.max(d.next || 1, max + 1);
    if (!Array.isArray(d.archive)) d.archive = [];   // [{ task, from, index, at }] newest first
    return d;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function snapshot() { history.push(JSON.stringify(data)); if (history.length > 200) history.shift(); }
  function undo() {
    const s = history.pop();
    if (s) { data = JSON.parse(s); save(); render(); }
  }
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  function find(id, node = data, parent = null) {
    if (node.id === id) return { node, parent };
    for (const c of node.children) { const r = find(id, c, node); if (r) return r; }
    return null;
  }
  function bfs(root = data) {
    const out = [], q = [...root.children];
    while (q.length) { const t = q.shift(); out.push(t); q.push(...t.children); }
    return out;
  }
  const elFor = id => id === zoom ? rootEl : rootEl.querySelector(`.task[data-id="${id}"]`);
  const nodeOf = id => (find(id) || find('root')).node;
  const parentId = id => id === 'root' ? 'root' : find(id).parent.id;
  const inside = (z, id) => z === 'root' || !!find(id, nodeOf(z));

  // Nearest-square arrangement: n children → ceil(√n) columns,
  // filled row by row (1 → 1, 2 → 2, 3 → 2+1, 4 → 2×2, 5 → 3+2, 9 → 3×3 …).
  function squareCols(n) { return Math.max(1, Math.ceil(Math.sqrt(n))); }

  // ── dates ───────────────────────────────────────────────
  const DAY = 864e5;
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const pad = n => String(n).padStart(2, '0');

  // "mm/dd/yy", also m/d, m/d/yy, m/d/yyyy (no year → this year)
  function parseDate(s) {
    const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/.exec(s);
    if (!m) return null;
    const mo = +m[1] - 1, d = +m[2];
    let y = m[3] ? +m[3] : new Date().getFullYear();
    if (m[3] && m[3].length === 2) y += 2000;
    if (mo < 0 || mo > 11 || d < 1 || d > daysIn(y, mo)) return null;
    return { y, m: mo, d };
  }
  // h, hh, h:mm, hh:mm, each optionally followed by a or p (am/pm also ok).
  // No suffix: 24-hour clock, so hours below 12 are am and 13–23 are pm.
  // Returns minutes after midnight.
  function parseTime(s) {
    const m = /^(\d{1,2})(?::([0-5]\d))?(?:([ap])m?)?$/i.exec(s);
    if (!m) return null;
    let h = +m[1];
    const min = m[2] ? +m[2] : 0, ap = m[3] && m[3].toLowerCase();
    if (ap) {
      if (h < 1 || h > 12) return null;
      if (ap === 'a' && h === 12) h = 0;
      if (ap === 'p' && h < 12) h += 12;
    } else if (h > 23) return null;
    return h * 60 + min;
  }
  // Pull @date / @time tokens out of free text. Other @words stay in the name.
  function parseWhen(text, needAt = true) {
    let date = null, time = null, any = false, bad = false;
    const kept = [];
    for (const tok of text.trim().split(/\s+/).filter(Boolean)) {
      const at = tok.startsWith('@');
      const body = at ? tok.slice(1) : tok;
      if ((at || !needAt) && body) {
        const d = parseDate(body);
        if (d) { date = d; any = true; continue; }
        const t = parseTime(body);
        if (t != null) { time = t; any = true; continue; }
        if (!needAt) bad = true;
      }
      kept.push(tok);
    }
    return { name: kept.join(' '), date, time, any, bad };
  }
  // Only a time → today. Only a date → 12am.
  function dueFrom(date, time) {
    if (!date && time == null) return null;
    const now = new Date();
    const d = date || { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
    const t = time ?? 0;
    return new Date(d.y, d.m, d.d, Math.floor(t / 60), t % 60).getTime();
  }
  function setDue(t, due) {
    if (due == null) { delete t.due; delete t.rep; delete t.anchor; return; }
    t.due = due;
    t.set = Date.now();                   // the clock for "fraction of time left" starts now
    t.anchor = new Date(due).getDate();   // day-of-month that monthly repeats aim for
  }
  function fmtTime(mins) {
    const h = Math.floor(mins / 60), m = mins % 60;
    return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? 'a' : 'p');
  }
  function fmtDue(t) {
    const d = new Date(t.due), now = new Date();
    const days = Math.round((startOfDay(d) - startOfDay(now)) / DAY);
    let s;
    if (days === 0) s = 'today';
    else if (days === 1) s = 'tmrw';
    else if (days === -1) s = 'yday';
    else if (days > 1 && days < 7) s = WD[d.getDay()];
    else s = MON[d.getMonth()] + ' ' + d.getDate() + (d.getFullYear() !== now.getFullYear() ? " '" + String(d.getFullYear()).slice(2) : '');
    const mins = d.getHours() * 60 + d.getMinutes();
    if (mins) s += ' ' + fmtTime(mins);
    if (t.rep) s += ' ↻';
    return s;
  }
  // Fraction of time left: 1 when the due time was set, 0 at (or past) due.
  function timeLeft(t) {
    if (!t.due) return null;
    const left = t.due - Date.now();
    if (left <= 0) return 0;
    const total = t.due - (t.set || t.due);
    return total > 0 ? Math.min(1, left / total) : 1;
  }
  // Bands: green 60–100% left, yellow 35–60%, orange 17–35%, red 0–17%.
  // Hue is anchored at each band's middle and blends across the boundaries,
  // so the card drifts green → yellow → orange → red rather than jumping.
  const HUE_STOPS = [[0.80, 125], [0.475, 50], [0.26, 28], [0.085, 2]];
  function hueFor(f) {
    if (f >= HUE_STOPS[0][0]) return HUE_STOPS[0][1];
    for (let i = 1; i < HUE_STOPS.length; i++) {
      const [f1, h1] = HUE_STOPS[i - 1], [f2, h2] = HUE_STOPS[i];
      if (f >= f2) return h2 + (h1 - h2) * (f - f2) / (f1 - f2);
    }
    return HUE_STOPS[HUE_STOPS.length - 1][1];
  }
  const darkMQ = matchMedia('(prefers-color-scheme: dark)');
  // Soft pastel normally; in the last 10% the red saturates sharply.
  function colorsFor(f) {
    const dark = darkMQ.matches, h = hueFor(f);
    // yellows/oranges look muddy at the same saturation as green/red, so lift them
    const warm = Math.max(0, 1 - Math.abs(h - 42) / 28);
    let s = (dark ? 30 : 52) + warm * (dark ? 14 : 30), l = (dark ? 21 : 91) - warm * (dark ? 0 : 2);
    if (f < 0.1) {
      const k = (1 - f / 0.1) ** 1.5;   // 0 → 1 over the final 10%, steepest at the end
      s += (dark ? 50 : 43) * k;
      l += (dark ? 9 : -13) * k;
    }
    return {
      bg: `hsl(${h.toFixed(1)} ${s.toFixed(1)}% ${l.toFixed(1)}%)`,
      line: `hsl(${h.toFixed(1)} ${Math.min(100, s + 10).toFixed(1)}% ${(dark ? l + 18 : l - 30).toFixed(1)}%)`,
    };
  }
  darkMQ.addEventListener('change', () => render());
  function nextOccurrence(t) {
    const d = new Date(t.due);
    const step = {
      daily: () => d.setDate(d.getDate() + 1),
      weekdays: () => { do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); },
      weekly: () => d.setDate(d.getDate() + 7),
      monthly: () => { const want = t.anchor || d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(want, daysIn(d.getFullYear(), d.getMonth()))); },
      yearly: () => { const want = t.anchor || d.getDate(), m = d.getMonth(); d.setDate(1); d.setFullYear(d.getFullYear() + 1); d.setDate(Math.min(want, daysIn(d.getFullYear(), m))); },
    }[t.rep];
    if (!step) return null;
    do step(); while (d.getTime() <= Date.now());   // skip occurrences already missed
    return d.getTime();
  }

  // ── render ──────────────────────────────────────────────
  function buildHead(t) {
    const head = document.createElement('div');
    head.className = 'head';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = t.name;
    head.append(name);
    if (t.due) {
      const due = document.createElement('span');
      due.className = 'due' + (timeLeft(t) === 0 ? ' over' : '');
      due.textContent = fmtDue(t);
      due.title = new Date(t.due).toLocaleString() + (t.rep ? ' · repeats ' + t.rep : '');
      head.append(due);
    }
    // the number doubles as a permalink: /tasks/#12 opens task 12 fullscreen
    const num = document.createElement('a');
    num.className = 'num';
    num.href = '#' + t.n;
    num.draggable = false;
    num.title = 'Open fullscreen (link to this task)';
    num.textContent = t.n;
    head.append(num);
    return head;
  }
  function build(t, depth, matches) {
    const el = document.createElement('div');
    el.dataset.id = t.id;
    const head = buildHead(t);
    const own = timeLeft(t);
    const kids = document.createElement('div');
    kids.className = 'kids';
    const childEls = t.children.map(c => build(c, depth + 1, matches));
    kids.append(...childEls);
    kids.style.setProperty('--cols', squareCols(t.children.length));
    // Background: this task's own countdown. Border: the most urgent
    // countdown anywhere inside it, so parents show what they contain.
    const fs = [own, ...childEls.map(c => c.dataset.f === undefined ? null : +c.dataset.f)].filter(f => f != null);
    const worst = fs.length ? Math.min(...fs) : null;
    if (worst != null) {
      el.dataset.f = worst;

  // ── editing ─────────────────────────────────────────────

  function say(text) {

  }
  function openCmd(prefix) {

  // ── scheduler (t) ──────────────────────────────────────
  const schedEl = document.getElementById('sched');

  const smonth = document.getElementById('smonth');
  const srep = document.getElementById('srep');
  let S = null;   // { id, date, time, vy, vm } while the popover is open

  function openSched(id) {

    if (S.time != null) parts.push(fmtTime(S.time));
    return parts.join(' ');
  }
  function drawCal() {
    smonth.textContent = new Date(S.vy, S.vm, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' });
    const cells = WD.map(w => `<span class="wd">${w.slice(0, 2)}</span>`);
    const lead = new Date(S.vy, S.vm, 1).getDay(), now = new Date();
    for (let i = 0; i < lead; i++) cells.push('<span></span>');
    for (let d = 1; d <= daysIn(S.vy, S.vm); d++) {
      const cls = [];
      if (S.vy === now.getFullYear() && S.vm === now.getMonth() && d === now.getDate()) cls.push('today');
      if (S.date && S.date.y === S.vy && S.date.m === S.vm && S.date.d === d) cls.push('on');

    sq.focus();

  function saveSched(clear) {

    const found = find(S.id);

      snapshot();
      const t = found.node;
      const nd = clear ? null : dueFrom(S.date, S.time);
      if (nd !== (t.due ?? null)) setDue(t, nd);   // unchanged time keeps its countdown

  // ── complete (x) ───────────────────────────────────────
  // Repeating tasks roll forward to their next occurrence; others are removed.
  function complete(id) {
    const found = find(id);
    if (!found || id === 'root') return;
    const t = found.node;
    snapshot();
    if (t.rep && t.due) {
      t.due = nextOccurrence(t);
      t.set = Date.now();

      say(`done: ${t.name}  (u to undo)`);
    }
    save(); render();
  }

  // ── archive (m+a, or drag onto the box icon) ────────────
  function archive(id) {

    parent.children.splice(Math.min(a.index, parent.children.length), 0, a.task);

  const countAll = t => 1 + t.children.reduce((n, c) => n + countAll(c), 0);
  function drawArchive() {
    if (apanel.hidden) return;
    const esc = x => x.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const rows = data.archive.map((a, k) => {

      return `<div class="row"><span class="nm" title="${esc(a.task.name)}">${esc(a.task.name)}</span>` +

  }
  archiveEl.addEventListener('click', () => toggleArchive());
  apanel.addEventListener('click', e => {
    const r = e.target.closest('[data-restore]'), x = e.target.closest('[data-purge]');
    if (r) restore(+r.dataset.restore);
    if (x) purge(+x.dataset.purge);
  });
  window.addEventListener('pointerdown', e => {
    if (!apanel.hidden && !apanel.contains(e.target) && !archiveEl.contains(e.target)) toggleArchive(false);
  }, true);

  function copyLink(id) {
    if (id === 'root') return;
    const url = location.origin + location.pathname + '#' + nodeOf(id).n;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
      .then(() => say('copied ' + url), () => say(url));
  }

  // colours depend on the clock, so refresh every 30s
  setInterval(() => { if (!editing && !S && !ptr) render(); }, 30000);

  // ── keyboard: dispatch ─────────────────────────────────
  const M_WINDOW = 350;    // ms allowed between m and a
  let mAt = -Infinity;
  window.addEventListener('keydown', e => { if (e.key === 'm' && !e.repeat && !editing && !S && document.activeElement !== cmdI) held.set('m', true); }, true);
  document.addEventListener('keydown', e => {
    if (S) {   // popover open but focus wandered off it
      if (e.key === 'Escape') closeSched();
      else if (e.key === 'Enter') { e.preventDefault(); saveSched(false); }
      return;
    }
    if (editing || document.activeElement === cmdI) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k in PARTNER) { e.preventDefault(); hjkl(e); return; }
    if (e.repeat) return;
    if (k === 'm') { mAt = performance.now(); return; }
    if (k === 'a') {
      if (held.has('m') || performance.now() - mAt < M_WINDOW) archive(cursor);
      mAt = -Infinity;
      return;
    }
    mAt = -Infinity;
    switch (k) {
      case 'o': e.preventDefault(); openNew(cursor); break;
      case 'O': e.preventDefault(); openSibling(); break;
      case 'r': e.preventDefault(); startRename(cursor); break;
      case 't': e.preventDefault(); openSched(cursor); break;
      case 'x': complete(cursor); break;
      case 'f': if (cursor !== 'root') zoomInto(cursor); break;
      case 'F':
        follow = !follow; drawMode(); render();
        say(follow ? 'follow on: view tracks the selected task' : 'follow off');
        break;
      case '~': zoom = cursor = 'root'; render(); break;
      case 'y': copyLink(cursor); break;
      case ':': case '/': e.preventDefault(); openCmd(k); break;
      case 'n': jumpMatch(1); break;
      case 'N': jumpMatch(-1); break;
      case 'u': undo(); break;
      case 'Escape':
        if (!apanel.hidden) toggleArchive(false);
        else if (highlight) { highlight = false; render(); }
        break;
    }
  });

  window.addEventListener('storage', e => { if (e.key === KEY && !editing) { data = load(); render(); } });

  openHash();
  render();
})();
</script>
