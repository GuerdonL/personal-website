<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9; --t0: #ffffff; --t1: #f5f5f4;
    --line: #e7e5e4; --line-strong: #a8a29e;
    --ink: #292524; --faint: #a8a29e; --accent: #57534e; --danger: #dc2626;
    --sel: #2563eb; --match: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --t0: #292524; --t1: #221f1d;
      --line: #3a3532; --line-strong: #78716c;
      --ink: #e7e5e4; --faint: #78716c; --accent: #d6d3d1; --danger: #f87171;
      --sel: #60a5fa; --match: #4a3b12;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.35 Inter, system-ui, sans-serif; }

  #root { min-height: 100%; padding: 52px 24px 110px; cursor: cell; }
  /* Each container is a grid whose column count comes from squareCols(n).
     Columns are max-content, so a box is exactly as big as its arranged
     children — sizes resolve bottom-up, from leaves to the root. */
  .kids {
    display: grid; grid-template-columns: repeat(var(--cols, 1), max-content);
    align-items: start; justify-content: start; gap: 8px;
  }
  #root > .kids { gap: 12px; }

  .task {
    display: flex; flex-direction: column; gap: 7px;
    min-width: 56px; padding: 7px 11px 13px;
    background: var(--t0); border: 1px solid var(--line); border-radius: 7px;
    cursor: cell; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: border-color .12s;
  }
  .task.odd { background: var(--t1); }
  .task.match { background: var(--match); }
  .task:not(.parent) > .kids:empty { display: none; }
  .task:hover:not(:has(.task:hover)) { border-color: var(--line-strong); }

  .head { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; cursor: default; }
  .num { margin-left: auto; font: 10px/1 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); }

  .sel { outline: 2px solid var(--sel); outline-offset: 1px; }
  #root.sel { outline: 1px solid var(--sel); outline-offset: -6px; }

  input.edit {
    font: inherit; font-weight: 500; color: inherit; background: transparent;
    border: 0; border-bottom: 1px solid var(--line-strong); outline: none;
    padding: 0; min-width: 5ch; max-width: 100%; field-sizing: content;
  }
  .kids > input.edit { padding: 7px 11px; border: 1px dashed var(--line-strong); border-radius: 7px; background: var(--t0); }

  .dragging { opacity: .25; }
  .ghost {
    position: fixed; z-index: 10; margin: 0; pointer-events: none;
    max-height: 220px; overflow: hidden; opacity: .92;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .drop { outline: 2px dashed var(--accent); outline-offset: 1px; }
  #root.drop { outline-offset: -8px; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }

  #trash {
    position: fixed; right: 22px; bottom: 22px; width: 44px; height: 44px;
    display: grid; place-items: center; color: var(--faint); opacity: .6;
    transition: transform .15s, color .15s, opacity .15s;
  }
  body.is-dragging #trash { opacity: 1; color: var(--ink); transform: scale(1.15); }
  #trash.over { color: var(--danger); transform: scale(1.4) !important; }

  #bar {
    position: fixed; left: 18px; bottom: 18px; display: flex; align-items: center;
    font: 13px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint);
  }
  #bar input { font: inherit; color: var(--ink); background: transparent; border: 0; outline: none; padding: 0; width: 40ch; }
  #cmd[hidden], #msg:empty { display: none; }
  #cmd { display: flex; color: var(--ink); }

  #hint { position: fixed; inset: 0; display: grid; place-items: center; color: var(--faint); pointer-events: none; }
  #hint[hidden] { display: none; }
  #home { position: fixed; left: 18px; top: 14px; font-size: 12px; color: var(--faint); text-decoration: none; }
  #home:hover { color: var(--ink); }
</style>
</head>
<body>
<a id="home" href="/">guerdon</a>
<div id="root" data-id="root"><div class="kids"></div></div>
<div id="hint">click, or press o, to add a task</div>
<div id="bar">
  <form id="cmd" hidden><span id="cmdp">:</span><input id="cmdi" autocomplete="off" spellcheck="false"></form>
  <span id="msg"></span>
</div>
<div id="trash" title="Drag here to delete">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
  </svg>
</div>
<script>
(() => {
  const KEY = 'nested-tasks-v1';
  const rootEl = document.getElementById('root');
  const hintEl = document.getElementById('hint');
  const trashEl = document.getElementById('trash');
  const cmdEl = document.getElementById('cmd');
  const cmdP = document.getElementById('cmdp');
  const cmdI = document.getElementById('cmdi');
  const msgEl = document.getElementById('msg');

  let data = load();
  let history = [];
  let editing = null;   // active <input>, if any
  let ptr = null;       // pointer gesture state
  let cursor = 'root';  // selected task id
  let query = null;     // last search string
  let highlight = false;

  // ── data ────────────────────────────────────────────────
  function load() {
    let d;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!d || !Array.isArray(d.children)) d = { id: 'root', children: [] };
    // give every task a permanent number (older saves had none)
    let max = 0;
    const all = bfs(d);
    all.forEach(t => { if (t.n) max = Math.max(max, t.n); });
    all.forEach(t => { if (!t.n) t.n = ++max; });
    d.next = Math.max(d.next || 1, max + 1);
    return d;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function snapshot() { history.push(JSON.stringify(data)); if (history.length > 200) history.shift(); }
  function undo() {
    const s = history.pop();
    if (s) { data = JSON.parse(s); save(); render(); }
  }
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  function find(id, node = data, parent = null) {
    if (node.id === id) return { node, parent };
    for (const c of node.children) { const r = find(id, c, node); if (r) return r; }
    return null;
  }
  function bfs(root = data) {
    const out = [], q = [...root.children];
    while (q.length) { const t = q.shift(); out.push(t); q.push(...t.children); }
    return out;
  }
  const elFor = id => id === 'root' ? rootEl : rootEl.querySelector(`.task[data-id="${id}"]`);

  // Nearest-square arrangement: n children → ceil(√n) columns,
  // filled row by row (1 → 1, 2 → 2, 3 → 2+1, 4 → 2×2, 5 → 3+2, 9 → 3×3 …).
  function squareCols(n) { return Math.max(1, Math.ceil(Math.sqrt(n))); }

  // ── render ──────────────────────────────────────────────
  function build(t, depth, matches) {
    const el = document.createElement('div');
    el.className = 'task' + (depth % 2 ? ' odd' : '') + (t.children.length ? ' parent' : '') + (matches.has(t.id) ? ' match' : '');
    el.dataset.id = t.id;
    const head = document.createElement('div');
    head.className = 'head';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = t.name;
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = t.n;
    head.append(name, num);
    const kids = document.createElement('div');
    kids.className = 'kids';
    kids.append(...t.children.map(c => build(c, depth + 1, matches)));
    kids.style.setProperty('--cols', squareCols(t.children.length));
    el.append(head, kids);
    return el;
  }
  function render() {
    const matches = new Set(highlight && query ? searchMatches(query) : []);
    const top = rootEl.querySelector(':scope > .kids');
    top.replaceChildren(...data.children.map(c => build(c, 0, matches)));
    top.style.setProperty('--cols', squareCols(data.children.length));
    if (!find(cursor)) cursor = 'root';
    rootEl.classList.remove('sel');
    elFor(cursor).classList.add('sel');
    updateHint();
  }
  function updateHint() { hintEl.hidden = data.children.length > 0 || !!editing; }

  function setCursor(id) {
    if (!find(id)) id = 'root';
    const old = elFor(cursor);
    old && old.classList.remove('sel');
    cursor = id;
    const el = elFor(id);
    el.classList.add('sel');
    if (id !== 'root') el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  // ── editing ─────────────────────────────────────────────
  function makeInput(value) {
    const inp = document.createElement('input');
    inp.className = 'edit';
    inp.value = value;
    inp.spellcheck = false;
    const fit = () => { inp.size = Math.max(5, inp.value.length + 1); };
    fit(); inp.addEventListener('input', fit);
    return inp;
  }

  // New task inside parentId; index = position among its children (default: end).
  function openNew(parentId, index = null) {
    const host = elFor(parentId);
    if (!host) return;
    const kids = host.querySelector(':scope > .kids');
    const inp = makeInput('');
    kids.insertBefore(inp, index == null ? null : kids.children[index] || null);
    editing = inp; updateHint();
    inp.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    inp.focus();
    let done = false;
    const finish = commit => {
      if (done) return false;
      done = true; editing = null;
      const v = inp.value.trim();
      const target = find(parentId);
      if (commit && v && target) {
        snapshot();
        const t = { id: uid(), n: data.next++, name: v, children: [] };
        if (index == null) target.node.children.push(t);
        else target.node.children.splice(index, 0, t);
        cursor = t.id;
        save(); render();
        return true;
      }
      inp.remove(); updateHint();
      return false;
    };
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (finish(true)) openNew(parentId, index == null ? null : index + 1); }
      else if (e.key === 'Escape') finish(false);
    });
    inp.addEventListener('blur', () => finish(true));
  }

  function openSibling() {
    if (cursor === 'root') return openNew('root');
    const f = find(cursor);
    openNew(f.parent.id, f.parent.children.indexOf(f.node) + 1);
  }

  function startRename(id) {
    const el = elFor(id), found = find(id);
    if (!el || !found || id === 'root') return;
    cursor = id;
    const t = found.node;
    const nameEl = el.querySelector(':scope > .head > .name');
    const inp = makeInput(t.name);
    nameEl.replaceWith(inp);
    editing = inp;
    inp.focus(); inp.select();
    let done = false;
    const finish = commit => {
      if (done) return;
      done = true; editing = null;
      const v = inp.value.trim();
      if (commit && v && v !== t.name) { snapshot(); t.name = v; save(); }
      render();
    };
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') finish(false);
    });
    inp.addEventListener('blur', () => finish(true));
  }

  rootEl.addEventListener('dblclick', e => {
    const n = e.target.closest('.name');
    if (n && !editing) startRename(n.closest('.task').dataset.id);
  });

  // ── click / drag ────────────────────────────────────────
  rootEl.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('input')) return;
    if (editing) { editing.blur(); return; }   // a click away just finishes editing
    const host = e.target.closest('[data-id]');
    if (!host) return;
    ptr = { id: host.dataset.id, x: e.clientX, y: e.clientY, onName: !!e.target.closest('.name'), drag: false };
  });

  function clearDrop() { rootEl.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); trashEl.classList.remove('over'); }

  function beginDrag() {
    const el = elFor(ptr.id);
    if (!el) { ptr = null; return; }
    const r = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.classList.remove('sel');
    const w = Math.min(r.width, 340);
    ghost.style.width = w + 'px';
    document.body.append(ghost);
    el.classList.add('dragging');
    document.body.classList.add('is-dragging');
    Object.assign(ptr, {
      drag: true, el, ghost,
      off: { x: Math.min(ptr.x - r.left, w - 12), y: Math.min(ptr.y - r.top, 28) },
    });
  }

  window.addEventListener('pointermove', e => {
    if (!ptr) return;
    if (!ptr.drag) {
      if (ptr.id === 'root' || Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) < 5) return;
      beginDrag();
      if (!ptr) return;
    }
    ptr.ghost.style.left = (e.clientX - ptr.off.x) + 'px';
    ptr.ghost.style.top = (e.clientY - ptr.off.y) + 'px';

    const under = document.elementFromPoint(e.clientX, e.clientY);
    clearDrop();
    ptr.target = null; ptr.overTrash = false;
    if (under && under.closest('#trash')) {
      ptr.overTrash = true; trashEl.classList.add('over');
    } else {
      const h = under && under.closest('[data-id]');
      if (h && h !== ptr.el && !ptr.el.contains(h)) { ptr.target = h.dataset.id; h.classList.add('drop'); }
    }
  });

  function endDrag(p) {
    clearDrop();
    p.ghost && p.ghost.remove();
    p.el && p.el.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
  }

  window.addEventListener('pointerup', () => {
    if (!ptr) return;
    const p = ptr; ptr = null;
    if (p.drag) {
      endDrag(p);
      const found = find(p.id);
      if (!found) return;
      if (p.overTrash) {
        snapshot();
        if (find(cursor, found.node)) cursor = found.parent.id;   // selection was inside the deleted task
        found.parent.children.splice(found.parent.children.indexOf(found.node), 1);
        save(); render();
      } else if (p.target) {
        const dest = find(p.target);
        if (!dest) return;
        snapshot();
        found.parent.children.splice(found.parent.children.indexOf(found.node), 1);
        dest.node.children.push(found.node);
        cursor = found.node.id;
        save(); render();
      }
      return;
    }
    setCursor(p.id);
    if (!p.onName) openNew(p.id);
  });

  window.addEventListener('pointercancel', () => { if (ptr && ptr.drag) endDrag(ptr); ptr = null; });

  // ── keyboard: movement ─────────────────────────────────
  // hjkl move within the current level, following the square grid.
  function move(k) {
    if (cursor === 'root') return;
    const f = find(cursor), sib = f.parent.children, n = sib.length;
    const cols = squareCols(n), rows = Math.ceil(n / cols);
    const i = sib.indexOf(f.node), row = Math.floor(i / cols), col = i % cols;
    let j = i;
    if (k === 'h' && col > 0) j = i - 1;
    if (k === 'l' && col < cols - 1 && i + 1 < n) j = i + 1;
    if (k === 'k' && row > 0) j = i - cols;
    if (k === 'j' && row < rows - 1) j = Math.min(i + cols, n - 1);
    setCursor(sib[j].id);
  }
  function descend() {
    const t = find(cursor).node;
    if (t.children.length) setCursor(t.children[0].id);
  }
  function ascend() {
    if (cursor !== 'root') setCursor(find(cursor).parent.id);
  }

  // k+l together = descend, j+h together = ascend. The first key of a chord
  // has already moved by the time the second arrives, so we rewind to where
  // the cursor was when that first key went down.
  const held = new Map();   // key → cursor at the moment it was pressed
  const PARTNER = { k: 'l', l: 'k', j: 'h', h: 'j' };
  function hjkl(e) {
    const k = e.key, partner = PARTNER[k];
    if (held.has(partner)) {
      if (e.repeat) return;
      setCursor(held.get(partner));
      (k === 'k' || k === 'l') ? descend() : ascend();
      held.set(k, cursor);
      held.set(partner, cursor);
      return;
    }
    if (!e.repeat) held.set(k, cursor);
    move(k);
  }
  window.addEventListener('keyup', e => held.delete(e.key));
  window.addEventListener('blur', () => held.clear());

  // ── keyboard: search & jump ────────────────────────────
  function searchMatches(q) {
    q = q.toLowerCase();
    return bfs().filter(t => t.name.toLowerCase().includes(q)).map(t => t.id);
  }
  let msgTimer;
  function say(text) {
    msgEl.textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { msgEl.textContent = ''; }, 2500);
  }
  function openCmd(prefix) {
    msgEl.textContent = '';
    cmdP.textContent = prefix;
    cmdI.value = '';
    cmdEl.hidden = false;
    cmdI.focus();
  }
  function closeCmd() { cmdEl.hidden = true; cmdI.blur(); }
  cmdI.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); closeCmd(); }
    else if (e.key === 'Backspace' && !cmdI.value) { e.preventDefault(); closeCmd(); }
  });
  cmdI.addEventListener('blur', () => { cmdEl.hidden = true; });
  cmdEl.addEventListener('submit', e => {
    e.preventDefault();
    const v = cmdI.value.trim(), prefix = cmdP.textContent;
    closeCmd();
    if (!v) return;
    if (prefix === ':' && /^\d+$/.test(v)) {
      const t = bfs().find(t => t.n === +v);
      if (t) setCursor(t.id); else say(`no task ${v}`);
      return;
    }
    query = v; highlight = true;
    jumpMatch(0);
  });
  // dir 0 = first match, +1 = next (n), -1 = previous (N); order is breadth-first.
  function jumpMatch(dir) {
    if (!query) return;
    const m = searchMatches(query);
    highlight = true;
    if (!m.length) { render(); say(`no match: ${query}`); return; }
    const i = m.indexOf(cursor);
    let j;
    if (dir === 0) j = 0;
    else if (i < 0) j = dir > 0 ? 0 : m.length - 1;
    else j = (i + dir + m.length) % m.length;
    cursor = m[j];
    render();
    elFor(cursor).scrollIntoView({ block: 'nearest', inline: 'nearest' });
    say(`${query}  [${j + 1}/${m.length}]`);
  }

  // ── keyboard: dispatch ─────────────────────────────────
  document.addEventListener('keydown', e => {
    if (editing || document.activeElement === cmdI) return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k in PARTNER) { e.preventDefault(); hjkl(e); return; }
    if (e.repeat) return;
    switch (k) {
      case 'o': e.preventDefault(); openNew(cursor); break;
      case 'O': e.preventDefault(); openSibling(); break;
      case 'r': e.preventDefault(); startRename(cursor); break;
      case ':': case '/': e.preventDefault(); openCmd(k); break;
      case 'n': jumpMatch(1); break;
      case 'N': jumpMatch(-1); break;
      case 'u': undo(); break;
      case 'Escape': if (highlight) { highlight = false; render(); } break;
    }
  });

  window.addEventListener('storage', e => { if (e.key === KEY && !editing) { data = load(); render(); } });

  render();
})();
</script>
</body>
</html>
