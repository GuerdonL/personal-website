[package]
name = "panels"
version = "0.1.0"
edition = "2021"
description = "A visual functional programming language. Rust, compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.106"
features = ["Document", "Element", "HtmlElement", "Window", "console"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
