<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panels</title>
<style>
  :root { --bg: #f9f8f6; --ink: #141414; --faint: #8a8a85; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15161a; --ink: #ebe9e4; --faint: #7d7f86; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  #stage { flex: 1; display: grid; place-items: center; text-align: center; white-space: pre-line; font-size: clamp(18px, 3vw, 28px); font-weight: 500; letter-spacing: -0.01em; line-height: 1.6; font-variant-numeric: tabular-nums; }
  #stage::first-line { font-size: 1.8em; font-weight: 600; }
  #stage.err { font-size: 15px; font-weight: 400; color: #c0392b; white-space: pre-wrap; padding: 24px; text-align: center; }
  footer { padding: 10px 16px; font-size: 12.5px; color: var(--faint); }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div id="stage">loading wasm…</div>
  <footer><a href="/">guerdon</a> · panels · rust → wasm</footer>
  <script type="module">
    import init from "./pkg/panels.js";
    try {
      await init();           // wasm-bindgen's #[wasm_bindgen(start)] runs inside init()
    } catch (e) {
      const s = document.getElementById("stage");
      s.className = "err";
      s.textContent = "wasm failed to load: " + (e && e.message ? e.message : e);
    }
  </script>
</body>
</html>
