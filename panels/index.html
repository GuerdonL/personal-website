<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9f8f6; --paper:#fbfaf8; --ink:#141414; --faint:#8a8a85;
  --root:#f5d865; --root-ink:#dcb420;
  --panel:#3b7ddd; --panel-fill:rgba(59,125,221,.04); --panel-hot:rgba(59,125,221,.12);
  --dot:#111; --dot-ring:#3b7ddd;
  --sel:#e0431f; --chrome:#f1efea; --rule:#dedbd3;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --paper:#1b1d22; --ink:#ebe9e4; --faint:#7d7f86;
    --root:#d8bd4a; --root-ink:#e9cd5a;
    --panel:#6d9ff0; --panel-fill:rgba(109,159,240,.06); --panel-hot:rgba(109,159,240,.16);
    --dot:#f2f2f2; --dot-ring:#6d9ff0;
    --sel:#ff6a45; --chrome:#111216; --rule:#2c2f36;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--chrome);border-bottom:1px solid var(--rule);flex:0 0 auto}
.mark{font-weight:700;letter-spacing:-.02em;text-decoration:none;color:inherit;margin-right:6px}
.mark span{color:var(--panel)}
.crumbs{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--faint);margin-right:auto;min-width:0;overflow:hidden}
.crumbs button{padding:3px 8px}
.crumbs .here{color:var(--ink);font-weight:500}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--panel)}
button:disabled{opacity:.4;cursor:default}
button.danger{color:var(--sel)}
button:focus-visible{outline:2px solid var(--panel);outline-offset:1px}

#stage{flex:1 1 auto;position:relative;min-height:0;cursor:crosshair}
svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.p-interior{fill:var(--panel-fill)}
.p-interior.hot{fill:var(--panel-hot)}
.p-border{fill:none;stroke:var(--panel);stroke-width:1.6;cursor:grab}
.p-border.sel{stroke:var(--sel);stroke-width:2.4}
.p-border.root{stroke:var(--root);stroke-width:4;cursor:default}
.p-hit{fill:none;stroke:transparent;stroke-width:28;cursor:grab}
.p-hit.root{cursor:default;pointer-events:none}
.p-val{font-weight:500;fill:var(--ink);cursor:grab}
.p-val.root{cursor:default;pointer-events:none}
.p-val.root{fill:var(--root-ink);font-weight:700}
.dot{fill:var(--dot);stroke:var(--dot-ring);stroke-width:2;cursor:grab}
.dot.sel{stroke:var(--sel);stroke-width:3}
.marquee{fill:var(--panel-fill);stroke:var(--panel);stroke-dasharray:4 4;stroke-width:1.2;pointer-events:none}
.ghost{opacity:.55;pointer-events:none}

.foot{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--chrome);border-top:1px solid var(--rule);font-size:12.5px;color:var(--faint);flex:0 0 auto;min-height:32px}
.foot .trace{color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.foot .hint{margin-left:auto;white-space:nowrap}
@media (max-width:700px){.foot .hint{display:none}}
#flash{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 12px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#flash.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <a class="mark" href="/" title="home">panels<span>{}</span></a>
  <div class="crumbs" id="crumbs"></div>
  <button id="tossDot">Toss a dot</button>
  <button id="tossPanel">Toss a panel</button>
  <button id="enterBtn" disabled>Enter</button>
  <button id="delBtn" class="danger" disabled>Delete</button>
  <button id="exportBtn">Export</button>
  <button id="importBtn">Import</button>
  <button id="resetBtn">Reset</button>
  <button id="themeBtn">Dark</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>

<div id="stage">
  <svg id="svg"></svg>
  <div id="flash"></div>
</div>

<div class="foot">
  <div class="trace" id="trace"></div>
  <div class="hint">tap empty space: dot · drag a box: panel · tap a panel's edge or number twice: enter · drag things to move or re-home them</div>
</div>

<script>
"use strict";
const SVGNS="http://www.w3.org/2000/svg";
const STORE="panels.program.v2";

/* ───────────── model ─────────────
   Every node is a panel. A dot is a leaf panel whose kind is "add" (the curried +1).
   Positions and sizes are fractions of the parent's interior, so a program keeps
   its shape at every zoom level.                                                    */

let seq=0;
const nid=()=>"n"+(++seq).toString(36)+Math.random().toString(36).slice(2,5);
const mkDot=(x,y)=>({id:nid(),kind:"add",x,y});
const mkPanel=(x,y,w,h,children=[])=>({id:nid(),kind:"panel",x,y,w,h,children});

function seed(){
  return mkPanel(0,0,1,1,[
    mkPanel(.24,.33,.2,.34,[mkDot(.4,.3),mkDot(.68,.42),mkDot(.47,.7)]),
    mkPanel(.56,.33,.15,.34,[mkDot(.6,.3),mkDot(.6,.7)]),
  ]);
}

let root=null;
let viewId="root";
let selected=null;
const index=new Map(), parentOf=new Map();

function reindex(){
  index.clear(); parentOf.clear();
  (function walk(n,p){ index.set(n.id,n); parentOf.set(n.id,p); if(n.children) for(const c of n.children) walk(c,n.id); })(root,null);
}

/* ───────────── evaluation ─────────────
   Dots coalesce additively: +1 +1 +1 → +3.
   Sibling panels combine by substitution, which is multiplication: [••] with •:=+3 → +6.
   Loose dots in a panel coalesce first, then multiply with the sub-panels.
   Each leaf kind has its own coalescence so new kinds (×-dots, i-dots) can slot in.  */

const KIND={
  add:{unit:1, join:(a,b)=>a+b, glyph:"•"},
};
function evaluate(n){
  if(n.kind!=="panel") return KIND[n.kind].unit;
  const leaves={}, panels=[];
  for(const c of n.children){
    if(c.kind==="panel") panels.push(evaluate(c));
    else leaves[c.kind]=(leaves[c.kind]===undefined)?KIND[c.kind].unit:KIND[c.kind].join(leaves[c.kind],KIND[c.kind].unit);
  }
  const k=leaves.add===undefined?0:leaves.add;
  if(!panels.length) return k;
  const prod=panels.reduce((a,b)=>a*b,1);
  return k>0?k*prod:prod;
}
function trace(n){
  const dots=n.children.filter(c=>c.kind==="add").length;
  const panels=n.children.filter(c=>c.kind==="panel").map(evaluate);
  const parts=[];
  if(dots) parts.push("•".repeat(Math.min(dots,12))+(dots>12?"…":"")+" → +"+dots);
  if(panels.length){
    const f=[...(dots?[dots]:[]),...panels];
    parts.push((f.length>1?f.join(" × ")+" = ":"")+evaluate(n));
  }
  if(!parts.length) return "empty → +0";
  return parts.join("   ·   ");
}

/* ───────────── persistence ───────────── */

function serialize(){ return JSON.stringify({v:2,root}); }
function sane(n,depth){
  if(!n||typeof n!=="object"||depth>60) return null;
  const num=(v,d)=>Number.isFinite(v)?Math.min(1,Math.max(0,v)):d;
  if(n.kind==="panel"){
    const ch=Array.isArray(n.children)?n.children.map(c=>sane(c,depth+1)).filter(Boolean):[];
    return {id:String(n.id||nid()),kind:"panel",x:num(n.x,.3),y:num(n.y,.3),w:Math.max(.05,num(n.w,.3)),h:Math.max(.05,num(n.h,.3)),children:ch};
  }
  if(KIND[n.kind]) return {id:String(n.id||nid()),kind:n.kind,x:num(n.x,.5),y:num(n.y,.5)};
  return null;
}
function load(json){
  const d=typeof json==="string"?JSON.parse(json):json;
  const r=sane(d&&d.root,0);
  if(!r||r.kind!=="panel") throw new Error("not a panels program");
  r.id="root"; r.x=0;r.y=0;r.w=1;r.h=1;
  root=r;
}
function save(){ try{ localStorage.setItem(STORE,serialize()); }catch(e){} }
(function boot(){
  let s=null; try{ s=localStorage.getItem(STORE); }catch(e){}
  if(s){ try{ load(s); return; }catch(e){} }
  root=seed(); root.id="root";
})();

/* ───────────── layout ─────────────
   The view panel fills the stage. Interiors are inset by a fixed pad, children are
   placed by their fractions inside the interior.                                   */

const PAD=16, MARGIN=20;
const rects=new Map();          // id → {x,y,w,h} absolute, plus interior ix,iy,iw,ih
function interior(r){ const p=Math.min(PAD,r.w*.12,r.h*.12); return {ix:r.x+p,iy:r.y+p,iw:Math.max(1,r.w-2*p),ih:Math.max(1,r.h-2*p)}; }
function layout(){
  rects.clear();
  const S=stage.getBoundingClientRect();
  const v=index.get(viewId);
  const base={x:MARGIN,y:MARGIN,w:S.width-2*MARGIN,h:S.height-2*MARGIN};
  (function place(n,r){
    const I=interior(r); rects.set(n.id,{...r,...I});
    if(n.kind!=="panel") return;
    for(const c of n.children){
      if(c.kind==="panel") place(c,{x:I.ix+c.x*I.iw,y:I.iy+c.y*I.ih,w:c.w*I.iw,h:c.h*I.ih});
      else rects.set(c.id,{cx:I.ix+c.x*I.iw,cy:I.iy+c.y*I.ih,r:dotRadius(I)});
    }
  })(v,base);
}
function dotRadius(I){ return Math.max(2.5,Math.min(13,Math.min(I.iw,I.ih)*.07)); }

/* ───────────── render ───────────── */

const stage=document.getElementById("stage"), svg=document.getElementById("svg");
function el(t,a={}){ const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }

function render(){
  reindex();
  if(!index.has(viewId)) viewId="root";
  if(selected&&!index.has(selected)) selected=null;
  layout();
  svg.textContent="";
  svg.appendChild(drawPanel(index.get(viewId)));
  drawChrome();
  save();
}

function drawPanel(n){
  const r=rects.get(n.id), isRoot=n.id===viewId;
  const g=el("g",{"data-id":n.id});
  const rx=Math.min(18,r.w*.08,r.h*.08);
  const inner=el("rect",{x:r.x,y:r.y,width:r.w,height:r.h,rx,class:"p-interior","data-interior":n.id});
  g.appendChild(inner);
  for(const c of n.children) g.appendChild(c.kind==="panel"?drawPanel(c):drawDot(c));
  const hit=el("rect",{x:r.x,y:r.y,width:r.w,height:r.h,rx,class:"p-hit"+(isRoot?" root":""),"data-drag":n.id});
  const border=el("rect",{x:r.x,y:r.y,width:r.w,height:r.h,rx,class:"p-border"+(isRoot?" root":"")+(selected===n.id?" sel":""),"data-drag":n.id});
  g.appendChild(hit); g.appendChild(border);
  const fs=isRoot?Math.min(34,r.h*.08):Math.max(7,Math.min(16,Math.min(r.w,r.h)*.1));
  const t=el("text",{x:r.x+(isRoot?fs*.8:fs*.55),y:isRoot?r.y+fs*1.5:r.y+r.h/2+fs*.35,"font-size":fs,class:"p-val"+(isRoot?" root":""),"data-drag":n.id});
  t.textContent=evaluate(n);
  g.appendChild(t);
  return g;
}
function drawDot(d){
  const r=rects.get(d.id);
  return el("circle",{cx:r.cx,cy:r.cy,r:r.r,class:"dot"+(selected===d.id?" sel":""),"data-drag":d.id});
}

function drawChrome(){
  const crumbs=document.getElementById("crumbs"); crumbs.textContent="";
  const chain=[]; for(let id=viewId;id;id=parentOf.get(id)) chain.unshift(id);
  chain.forEach((id,i)=>{
    const n=index.get(id);
    if(i<chain.length-1){
      const b=document.createElement("button"); b.textContent=id==="root"?"root":evaluate(n);
      b.addEventListener("click",()=>{ viewId=id; selected=null; render(); });
      crumbs.appendChild(b);
      const s=document.createElement("span"); s.textContent="›"; crumbs.appendChild(s);
    }else{
      const s=document.createElement("span"); s.className="here"; s.textContent=id==="root"?"root":"panel "+evaluate(n); crumbs.appendChild(s);
    }
  });
  const sel=selected?index.get(selected):null;
  document.getElementById("enterBtn").disabled=!(sel&&sel.kind==="panel");
  document.getElementById("delBtn").disabled=!sel;
  document.getElementById("trace").textContent=trace(sel&&sel.kind==="panel"?sel:index.get(viewId));
}

/* ───────────── interaction ───────────── */

function pt(ev){ const b=svg.getBoundingClientRect(); return {x:ev.clientX-b.left,y:ev.clientY-b.top}; }
function toFrac(id,x,y){ const I=rects.get(id); return {x:Math.min(1,Math.max(0,(x-I.ix)/I.iw)),y:Math.min(1,Math.max(0,(y-I.iy)/I.ih))}; }
function inside(id,x,y){ const r=rects.get(id); return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function subtree(id){ const s=new Set(); (function w(n){ s.add(n.id); if(n.children) n.children.forEach(w); })(index.get(id)); return s; }
function panelAt(x,y,exclude){           // deepest visible panel containing (x,y), skipping a subtree
  let best=null;
  (function w(n,d){
    if(exclude.has(n.id)||n.kind!=="panel"||!inside(n.id,x,y)) return;
    best=n.id; for(const c of n.children) w(c,d+1);
  })(index.get(viewId),0);
  return best;
}
function detach(id){ const p=index.get(parentOf.get(id)); p.children=p.children.filter(c=>c.id!==id); }

let press=null, marquee=null, ghost=null;
const TAP=5;

svg.addEventListener("pointerdown",ev=>{
  if(ev.button&&ev.button!==0) return;
  const t=ev.target, p=pt(ev);
  svg.setPointerCapture(ev.pointerId);
  if(t.dataset.drag&&t.dataset.drag!==viewId){
    press={mode:"drag",id:t.dataset.drag,x0:p.x,y0:p.y,moved:false,t};
  }else if(t.dataset.interior){
    press={mode:"space",id:t.dataset.interior,x0:p.x,y0:p.y,moved:false};
  }else press=null;
});

svg.addEventListener("pointermove",ev=>{
  if(!press) return;
  const p=pt(ev), dx=p.x-press.x0, dy=p.y-press.y0;
  if(!press.moved&&Math.hypot(dx,dy)<TAP) return;
  press.moved=true;
  if(press.mode==="space"){
    if(!marquee){ marquee=el("rect",{class:"marquee",rx:8}); svg.appendChild(marquee); }
    const I=rects.get(press.id);
    const x=Math.max(I.ix,Math.min(press.x0,p.x)), y=Math.max(I.iy,Math.min(press.y0,p.y));
    const x2=Math.min(I.ix+I.iw,Math.max(press.x0,p.x)), y2=Math.min(I.iy+I.ih,Math.max(press.y0,p.y));
    marquee.setAttribute("x",x); marquee.setAttribute("y",y);
    marquee.setAttribute("width",Math.max(0,x2-x)); marquee.setAttribute("height",Math.max(0,y2-y));
    press.box={x,y,w:x2-x,h:y2-y};
  }else{
    if(!ghost){ ghost=press.t.closest("g[data-id]")&&press.t.classList.contains("p-border")?press.t.closest("g[data-id]"):press.t; ghost.classList.add("ghost"); }
    ghost.setAttribute("transform",`translate(${dx},${dy})`);
    const n=index.get(press.id), ex=subtree(press.id);
    const c=n.kind==="panel"?{x:rects.get(n.id).x+rects.get(n.id).w/2+dx,y:rects.get(n.id).y+rects.get(n.id).h/2+dy}:{x:rects.get(n.id).cx+dx,y:rects.get(n.id).cy+dy};
    const home=panelAt(c.x,c.y,ex);
    svg.querySelectorAll(".p-interior.hot").forEach(e=>e.classList.remove("hot"));
    if(home&&home!==parentOf.get(press.id)) svg.querySelector(`[data-interior="${home}"]`)?.classList.add("hot");
    press.home=home; press.dx=dx; press.dy=dy;
  }
});

function endPress(ev){
  if(!press) return;
  const P=press; press=null;
  if(marquee){ marquee.remove(); marquee=null; }
  if(ghost){ ghost.classList.remove("ghost"); ghost.removeAttribute("transform"); ghost=null; }
  if(P.mode==="space"){
    if(!P.moved){                                   // tap: a dot, the curried +1
      const f=toFrac(P.id,P.x0,P.y0);
      index.get(P.id).children.push(mkDot(f.x,f.y));
      selected=null; render(); return;
    }
    if(P.box&&P.box.w>22&&P.box.h>22){              // box: a new, empty panel
      const I=rects.get(P.id);
      const np=mkPanel((P.box.x-I.ix)/I.iw,(P.box.y-I.iy)/I.ih,P.box.w/I.iw,P.box.h/I.ih);
      index.get(P.id).children.push(np);
      selected=np.id; render();
    }
    return;
  }
  if(!P.moved){                                    // tap selects; a second tap soon after enters
    const now=performance.now();
    if(lastTap&&lastTap.id===P.id&&now-lastTap.t<380&&n0(P.id).kind==="panel"){ lastTap=null; enter(P.id); return; }
    lastTap={id:P.id,t:now};
    selected=selected===P.id?null:P.id; render(); return;
  }
  const n=index.get(P.id), home=P.home;
  if(!home){ flash("Dropped outside — nothing moved."); render(); return; }
  if(home===P.id||subtree(P.id).has(home)) { render(); return; }
  detach(P.id);
  const I=rects.get(home);
  if(n.kind==="panel"){
    const r=rects.get(n.id);
    n.w=Math.min(1,r.w/I.iw); n.h=Math.min(1,r.h/I.ih);
    n.x=Math.min(1-n.w,Math.max(0,(r.x+P.dx-I.ix)/I.iw)); n.y=Math.min(1-n.h,Math.max(0,(r.y+P.dy-I.iy)/I.ih));
  }else{
    const r=rects.get(n.id), f=toFrac(home,r.cx+P.dx,r.cy+P.dy); n.x=f.x; n.y=f.y;
  }
  index.get(home).children.push(n);
  render();
}
svg.addEventListener("pointerup",endPress);
svg.addEventListener("pointercancel",()=>{ press=null; if(marquee){marquee.remove();marquee=null;} if(ghost){ghost.classList.remove("ghost");ghost.removeAttribute("transform");ghost=null;} render(); });

let lastTap=null;
const n0=id=>index.get(id);
function enter(id){ viewId=id; selected=null; render(); }

function remove(id){
  if(!id||id==="root") return;
  detach(id); if(viewId===id||subtree(id).has(viewId)) viewId=parentOf.get(id);
  selected=null; render();
}
document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT") return;
  if(ev.key==="Escape"){ selected=null; render(); }
  if((ev.key==="Backspace"||ev.key==="Delete")&&selected){ ev.preventDefault(); remove(selected); }
  if(ev.key==="Enter"&&selected&&index.get(selected).kind==="panel") enter(selected);
  if(ev.key==="ArrowUp"&&viewId!=="root"){ viewId=parentOf.get(viewId); selected=null; render(); }
});

document.getElementById("delBtn").addEventListener("click",()=>remove(selected));
document.getElementById("enterBtn").addEventListener("click",()=>{ if(selected) enter(selected); });
document.getElementById("tossDot").addEventListener("click",()=>{
  const v=index.get(viewId); v.children.push(mkDot(.1+Math.random()*.8,.1+Math.random()*.8)); render();
});
document.getElementById("tossPanel").addEventListener("click",()=>{
  const v=index.get(viewId), w=.18+Math.random()*.14, h=.2+Math.random()*.16;
  const p=mkPanel(Math.random()*(1-w),Math.random()*(1-h),w,h); v.children.push(p); selected=p.id; render();
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Replace the current program with the example?")) return;
  root=seed(); root.id="root"; viewId="root"; selected=null; render();
});
document.getElementById("exportBtn").addEventListener("click",()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([serialize()],{type:"application/json"})); a.download="panels.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
const importFile=document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click",()=>importFile.click());
importFile.addEventListener("change",()=>{
  const f=importFile.files[0]; if(!f) return;
  f.text().then(t=>{ load(t); viewId="root"; selected=null; render(); }).catch(()=>flash("That file isn't a panels program."));
  importFile.value="";
});
document.getElementById("themeBtn").addEventListener("click",ev=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
  ev.target.textContent=dark?"Dark":"Light";
});

let flashT;
function flash(msg){ const f=document.getElementById("flash"); f.textContent=msg; f.classList.add("show"); clearTimeout(flashT); flashT=setTimeout(()=>f.classList.remove("show"),2400); }

window.addEventListener("resize",render);
render();
</script>
</body>
</html>
