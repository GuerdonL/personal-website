<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7e5e4; --paper: #ffffff; --t0: #ffffff; --t1: #f5f5f4;
    --line: #e7e5e4; --line-strong: #a8a29e;
    --ink: #292524; --faint: #a8a29e; --accent: #57534e; --danger: #dc2626;
    --sel: #2563eb; --ok: #16a34a; --match: #ca8a04;
    --rule: #eef0f3; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06);
    --pen-ink: #1c1917;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141211; --paper: #1f1c1a; --t0: #292524; --t1: #221f1d;
      --line: #3a3532; --line-strong: #78716c;
      --ink: #e7e5e4; --faint: #78716c; --accent: #d6d3d1; --danger: #f87171;
      --sel: #60a5fa; --ok: #4ade80; --match: #facc15;
      --rule: #2a2624; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
      --pen-ink: #f5f5f4;
    }
  }
  * { box-sizing: border-box; -webkit-touch-callout: none; }
  body, #scroller, #layer, #bar { user-select: none; -webkit-user-select: none; }
  input, textarea, [contenteditable] { user-select: text; -webkit-user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.35 Inter, system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { display: block; }

  /* ---------- top bar ---------- */
  #bar {
    flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px;
    background: var(--t0); border-bottom: 1px solid var(--line);
    z-index: 20; position: relative;
  }
  #bar .ib {
    width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
    color: var(--accent); flex: none;
  }
  #bar .ib:hover { background: var(--t1); }
  #bar .ib.on { background: var(--ink); color: var(--t0); }
  #bar .ib:disabled { opacity: .35; cursor: default; }
  #bar .ib svg { width: 20px; height: 20px; }
  #title {
    flex: 1 1 140px; min-width: 80px; height: 36px; border: 0; background: transparent;
    font: 500 15px Inter, system-ui, sans-serif; color: var(--ink); outline: none;
    padding: 0 6px; border-radius: 8px;
  }
  #title:focus { background: var(--t1); }
  .grp { display: flex; align-items: center; gap: 2px; }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  #recpill {
    display: none; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 10px;
    border-radius: 16px; background: #fee2e2; color: #991b1b; font: 12px/1 'JetBrains Mono', ui-monospace, monospace;
  }
  #recpill.on { display: inline-flex; }
  #recpill .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; animation: blink 1s infinite; }
  #recpill button { height: 24px; padding: 0 10px; border-radius: 12px; background: #991b1b; color: #fff; font: 500 12px Inter, system-ui, sans-serif; }
  @keyframes blink { 50% { opacity: .25; } }

  /* color + width popover */
  #pop {
    position: absolute; top: 100%; z-index: 30; margin-top: 4px;
    background: var(--t0); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 8px; display: none; gap: 10px; align-items: center;
  }
  #pop.open { display: flex; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; display: grid; place-items: center; }
  .sw i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .sw.on { border-color: var(--sel); }
  .wd { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .wd.on { background: var(--t1); }
  .wd i { background: var(--ink); border-radius: 50%; display: block; }

  /* ---------- drawer ---------- */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 40; display: none; }
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); z-index: 41;
    background: var(--t0); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .18s ease-out;
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px);
  }
  body.drawer #drawer { transform: none; }
  body.drawer #scrim { display: block; }
  #drawer header { display: flex; align-items: center; padding: 12px 12px 8px; gap: 8px; }
  #drawer header b { font-weight: 500; flex: 1; }
  #drawer .new { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--ink); color: var(--t0); font-weight: 500; }
  #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 8px 20px; }
  .it {
    display: flex; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 8px; cursor: pointer;
  }
  .it:hover { background: var(--t1); }
  .it.cur { background: var(--t1); box-shadow: inset 3px 0 0 var(--sel); }
  .it .m { flex: 1; min-width: 0; }
  .it .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .d { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); margin-top: 2px; }
  .it .del { color: var(--faint); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .it .del:hover { color: var(--danger); background: var(--t0); }
  #drawer footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; }
  #drawer footer button { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  #syncPanel { border-top: 1px solid var(--line); padding: 10px 12px; font-size: 12px; color: var(--accent); display: flex; flex-direction: column; gap: 6px; }
  #syncPanel b { color: var(--ink); font-weight: 500; }
  #syncPanel p { margin: 0; }
  #syncPanel .muted { color: var(--faint); }
  #syncPanel a { color: var(--accent); }
  #syncPanel input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--t1); color: var(--ink); font: 13px 'JetBrains Mono', ui-monospace, monospace; outline: none; }
  #syncPanel input:focus { border-color: var(--line-strong); }
  #syncPanel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #syncPanel .btn { height: 28px; padding: 0 10px; border-radius: 6px; background: var(--ink); color: var(--t0); font-weight: 500; }
  #syncPanel .lnk { text-decoration: underline; text-underline-offset: 2px; }
  #syncPanel .err { color: var(--danger); }
  #syncBtn .cloud { position: relative; }
  #syncBtn[data-state=syncing] svg { animation: pulse 1s infinite; }
  #syncBtn[data-state=error] { color: var(--danger); }
  #syncBtn[data-state=off] { opacity: .45; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- page ---------- */
  #scroller {
    flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: none;
    position: relative; overscroll-behavior: contain;
  }
  #wrap { margin: 0 auto; position: relative; }
  #layer {
    position: absolute; left: 0; top: 0; width: 1000px; transform-origin: 0 0;
    background: var(--paper);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 32px; background-position: 0 31px;
    box-shadow: var(--shadow);
  }
  #cv { position: absolute; left: 0; top: 0; width: 1000px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv.pen { cursor: crosshair; }
  #cv.text { cursor: cell; }
  #cv.hand { cursor: grab; }
  #cv.eraser { cursor: cell; }
  #ov { position: absolute; left: 0; top: 0; width: 1000px; height: 100%; pointer-events: none; }
  #ov > * { pointer-events: auto; }
  #marq { position: absolute; border: 1px dashed var(--sel); background: rgba(37,99,235,.06); display: none; pointer-events: none; }
  #more {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: grid; place-items: center;
    color: var(--faint); font-size: 12px; pointer-events: auto;
  }
  #more:hover { color: var(--accent); }

  /* text boxes & audio cards */
  .tb, .ac {
    position: absolute; background: var(--t0); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); min-width: 120px;
  }
  .tb.sel, .ac.sel { border-color: var(--sel); box-shadow: 0 0 0 2px rgba(37,99,235,.2); }
  .grip {
    display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 8px;
    color: var(--faint); font: 11px 'JetBrains Mono', ui-monospace, monospace;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; background: var(--t1);
  }
  .grip .sp { flex: 1; }
  .grip .x { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--faint); }
  .grip .x:hover { color: var(--danger); }
  .grip .x svg { width: 12px; height: 12px; }
  .tb textarea {
    display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    font: 15px/1.45 Inter, system-ui, sans-serif; padding: 8px 10px; min-height: 48px; overflow: hidden;
  }
  .rz {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 55%, var(--line-strong) 55%, var(--line-strong) 65%, transparent 65%, transparent 80%, var(--line-strong) 80%, var(--line-strong) 90%, transparent 90%);
    border-radius: 0 0 8px 0;
  }

  .ac { width: 360px; max-width: 920px; }
  .ac .grip .mic { display: none; }
  .ac .grip .mic svg { width: 13px; height: 13px; }
  .ac .grip .tabs { display: flex; gap: 1px; background: var(--t0); border: 1px solid var(--line); border-radius: 5px; padding: 1px; }
  .ac .grip .tabs button { height: 16px; padding: 0 6px; border-radius: 3px; font: 10px Inter, system-ui, sans-serif; color: var(--faint); }
  .ac .grip .tabs button.on { background: var(--ink); color: var(--t0); }
  .ac .ctl .pct { display: none; font: 12px 'JetBrains Mono', ui-monospace, monospace; color: var(--accent); flex: 1; text-align: center; }
  .ac .ctl .pin { color: var(--faint); display: inline-flex; flex: none; }
  .ac .ctl .pin svg { width: 15px; height: 15px; }
  .ac .ctl a.pin { color: var(--accent); }
  .ac.narrow .grip .st, .ac.narrow .grip .tabs, .ac.narrow .ctl .seek, .ac.narrow .ctl .time, .ac.narrow .tx { display: none; }
  .ac.narrow .grip .mic, .ac.narrow .ctl .pct { display: inline-flex; }
  .ac.narrow .ctl .pct { display: block; }
  .ac.narrow .body { padding: 6px 8px 8px; }
  .ac.hidden .tx { display: none; }
  .ac .dl { font-size: 12px; color: var(--faint); }
  .ac .grip .rec { color: #dc2626; display: inline-flex; align-items: center; gap: 5px; }
  .ac .grip .rec::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #dc2626; animation: blink 1s infinite; }
  .ac .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .ac .ctl { display: flex; align-items: center; gap: 8px; }
  .ac .play { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--t0); display: grid; place-items: center; flex: none; }
  .ac .play svg { width: 14px; height: 14px; }
  .ac .seek { flex: 1; accent-color: var(--ink); height: 20px; margin: 0; touch-action: none; }
  .ac .time { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); flex: none; min-width: 72px; text-align: right; }
  .ac .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
  .ac .meta a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .ac .meta a:hover { text-decoration: underline; }
  .ac .meta svg { width: 13px; height: 13px; }
  .ac .tabs { display: flex; gap: 2px; background: var(--t1); border-radius: 6px; padding: 2px; align-self: flex-start; }
  .ac .tabs button { height: 24px; padding: 0 10px; border-radius: 5px; font-size: 12px; color: var(--faint); }
  .ac .tabs button.on { background: var(--t0); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ac .tx { font-size: 14px; line-height: 1.5; }
  .ac .tx textarea {
    display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink);
    font: 14px/1.5 Inter, system-ui, sans-serif; padding: 6px 8px; resize: none; overflow: hidden; outline: none; min-height: 40px;
  }
  .ac .tx textarea:focus { border-color: var(--line-strong); }
  .ac .lines { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ac .ln { display: flex; gap: 8px; padding: 3px 6px; border-radius: 5px; cursor: pointer; align-items: baseline; }
  .ac .ln:hover { background: var(--t1); }
  .ac .ln.cur { background: #fef9c3; color: #292524; }
  @media (prefers-color-scheme: dark) { .ac .ln.cur { background: #3f3a1d; color: #fef08a; } }
  .ac .ln .t { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); flex: none; width: 38px; }
  .ac .ln .w { flex: 1; outline: none; }
  .ac .ln .w:focus { background: var(--t0); box-shadow: 0 0 0 1px var(--line-strong); border-radius: 3px; }
  .ac .interim { color: var(--faint); font-style: italic; }
  .ac .empty { color: var(--faint); font-size: 12px; font-style: italic; }
  .ac .live { display: flex; flex-direction: column; gap: 6px; }
  .ac .stop { height: 32px; padding: 0 14px; border-radius: 8px; background: #991b1b; color: #fff; font-weight: 500; align-self: flex-start; }

  /* close-button popout: archive / trash */
  .grip { position: relative; }
  .pop {
    position: absolute; right: 26px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; z-index: 5;
    background: var(--t0); border: 1px solid var(--line); border-radius: 7px; padding: 3px; box-shadow: var(--shadow);
    animation: popin .16s ease-out; transform-origin: right center;
  }
  @keyframes popin { from { opacity: 0; transform: translateY(-50%) translateX(10px) scaleX(.6); } to { opacity: 1; transform: translateY(-50%); } }
  .pop button { height: 24px; padding: 0 9px; border-radius: 5px; font: 500 12px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 5px; }
  .pop button svg { width: 13px; height: 13px; }
  .pop .arch { color: var(--accent); background: var(--t1); }
  .pop .trash { color: #fff; background: var(--danger); }
  .it { position: relative; }
  .it .pop { right: 40px; }

  /* embedded media cards */
  .em { position: absolute; background: var(--t0); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow: hidden; }
  .em.sel { border-color: var(--sel); box-shadow: 0 0 0 2px rgba(37,99,235,.2); }
  .em .grip .edit { height: 18px; padding: 0 8px; border-radius: 4px; background: var(--ink); color: var(--t0); font: 500 11px Inter, system-ui, sans-serif; }
  .em .grip .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .em .pv { position: relative; min-height: 48px; overflow: hidden; max-height: 640px; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--paper); }
  .em .pv .stack { position: relative; transform-origin: 0 0; width: 1000px; }
  .em .pv.file { padding: 14px 12px; display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 13px; }
  .em .pv.file svg { width: 22px; height: 22px; flex: none; }
  .em .pv .missing { padding: 14px 12px; color: var(--faint); font-size: 12px; font-style: italic; }
  .em .pv .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 12px; }

  /* media note background (image / pdf pages / file chip) */
  #media { position: absolute; left: 0; top: 0; width: 1000px; pointer-events: none; }
  #media img, #media canvas { display: block; width: 1000px; }
  #media canvas + canvas { border-top: 1px solid var(--line); }
  #media .chip { pointer-events: auto; margin: 20px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--t1); border: 1px solid var(--line); color: var(--accent); font-size: 13px; text-decoration: none; }
  #media .chip svg { width: 20px; height: 20px; }
  #bar #backBtn { display: none; }
  body.child #bar #backBtn { display: grid; }
  body.child #bar #menuBtn { display: none; }
  .it .k { display: inline-block; font: 10px/14px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 6px; vertical-align: 1px; }
  .it .pv { width: 40px; height: 40px; border-radius: 6px; background: var(--t1); overflow: hidden; flex: none; display: grid; place-items: center; color: var(--faint); }
  .it .pv img, .it .pv canvas { width: 100%; height: 100%; object-fit: cover; }
  .it .pv svg { width: 18px; height: 18px; }
  #drawer .sec { padding: 10px 10px 4px; font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #drawer .sec::before { content: '▸'; transition: transform .12s; }
  #drawer .sec.open::before { transform: rotate(90deg); }
  .it .rs { color: var(--accent); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; margin-right: 4px; }
  #toast.act { pointer-events: auto; }
  #toast button { color: var(--match); font-weight: 500; margin-left: 12px; text-decoration: underline; text-underline-offset: 2px; }

  /* selection */
  #selui { position: absolute; left: 0; top: 0; width: 1000px; height: 100%; pointer-events: none; --iz: 1; }
  #selui > * { pointer-events: auto; }
  #selbox { position: absolute; display: none; border: 1px solid var(--sel); outline: 1px solid rgba(255,255,255,.5); pointer-events: none; }
  #selbox.on { display: block; }
  .hd { position: absolute; width: calc(12px * var(--iz)); height: calc(12px * var(--iz)); background: var(--t0); border: calc(1.5px * var(--iz)) solid var(--sel); border-radius: 2px; transform: translate(-50%, -50%); touch-action: none; }
  .hd.nw, .hd.se { cursor: nwse-resize; } .hd.ne, .hd.sw { cursor: nesw-resize; }
  .hd.rot { border-radius: 50%; cursor: grab; }
  #rotline { position: absolute; width: 0; border-left: 1px dashed var(--sel); transform: translateX(-50%); pointer-events: none; }
  #seltb {
    position: absolute; display: none; gap: 2px; padding: 3px; background: var(--t0); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); transform: translate(-50%, calc(-100% - 10px * var(--iz))) scale(var(--iz)); transform-origin: 50% 100%; white-space: nowrap;
  }
  #seltb.on { display: flex; }
  #seltb button { height: 28px; padding: 0 10px; border-radius: 6px; font: 500 12px Inter, system-ui, sans-serif; color: var(--accent); }
  #seltb button:hover { background: var(--t1); }
  #seltb button.danger { color: var(--danger); }
  #seltb button.prime { background: var(--ink); color: var(--t0); }
  #seltb .n { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); padding: 0 6px; align-self: center; }
  #cv.hand { cursor: default; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--t0); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
    transition: .18s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 520px) {
    #bar { gap: 2px; padding-left: 6px; padding-right: 6px; }
    #bar .ib { width: 34px; }
    #title { flex-basis: 100%; order: -1; height: 32px; }
    .sep { margin: 0 2px; }
  }
</style>
</head>
<body>

<header id="bar">
  <button class="ib" id="backBtn" title="Back to the note this is embedded in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <button class="ib" id="menuBtn" title="Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

    const setArchived = async v => { n.archived = v; n.updated = Date.now(); await DB.put(n); if (note && note.id === n.id) note.archived = v; refreshList(); schedulePush(); };
    popout(it.querySelector('.del'), archived ? { trash } : { archive: () => setArchived(true), trash });
    if (archived) it.querySelector('.rs').addEventListener('click', e => { e.stopPropagation(); setArchived(false); });
    return it;
  };
  for (const n of all.filter(n => !n.archived)) list.appendChild(row(n, false));
  const arch = all.filter(n => n.archived), items = note ? note.archive : [];
  if (arch.length || items.length) {
    const sec = document.createElement('div'); sec.className = 'sec' + (listArchOpen ? ' open' : ''); sec.textContent = `Archived · ${arch.length + items.length}`;
    const wrap = document.createElement('div'); wrap.style.display = listArchOpen ? '' : 'none';
    sec.addEventListener('click', () => { listArchOpen = !listArchOpen; sec.classList.toggle('open', listArchOpen); wrap.style.display = listArchOpen ? '' : 'none'; });
    list.appendChild(sec); list.appendChild(wrap);
    for (const n of arch) wrap.appendChild(row(n, true));
    for (const a of items) {
      const it = document.createElement('div'); it.className = 'it';
      const label = a.kind === 'box' ? 'Text: ' + (a.item.text.trim().slice(0, 40) || '(empty)') : a.kind === 'audio' ? 'Recording ' + fmtT(a.item.duration) : 'Embedded media';
      it.innerHTML = `<div class="m"><div class="n">${esc(label)}</div><div class="d">in this note · archived ${fmtD(a.at)}</div></div><button class="rs">Restore</button><button class="del">${X}</button>`;
      it.querySelector('.rs').addEventListener('click', () => { note.archive = note.archive.filter(x => x !== a); note[a.kind === 'box' ? 'boxes' : a.kind === 'audio' ? 'audios' : 'embeds'].push(a.item); renderItem(a.kind, a.item); save(); refreshList(); });
      popout(it.querySelector('.del'), { trash: () => { note.archive = note.archive.filter(x => x !== a); save(); refreshList(); } });
      wrap.appendChild(it);
    }
  }
}
let listArchOpen = false;
async function thumb(el, n) {
  try {
    if (!n.media.blob) { el.innerHTML = n.kind === 'pdf' ? PDF_ICON : n.kind === 'image' ? IMG_ICON : FILE_ICON; return; }
    if (n.kind === 'image') { const img = document.createElement('img'); img.src = mediaUrl(n); el.appendChild(img); }
    else if (n.kind === 'pdf') { const { pages } = await pdfPages(n); const c = document.createElement('canvas'); c.width = 80; c.height = 80; const p = pages[0].canvas; const sc = Math.max(80 / p.width, 80 / p.height); c.getContext('2d').drawImage(p, 0, 0, p.width * sc, p.height * sc); el.appendChild(c); }
    else el.innerHTML = FILE_ICON;
  } catch (e) { el.innerHTML = FILE_ICON; }
}
async function openNote(id) {
  if (recording) stopRec();
  if (note) await saveNow();
  const n = await DB.get(id); if (!n) return;
  loadNote(upgradeNote(n));
  localStorage.setItem('notes:last', id);
  refreshList();
}
async function newNote() {
  if (recording) stopRec();
  if (note) await saveNow();
  const n = blankNote(); await DB.put(n); loadNote(n);
  localStorage.setItem('notes:last', n.id); refreshList();
  $('#title').focus();
}
function loadNote(n, keepView) {
  for (const u of urls.values()) URL.revokeObjectURL(u); urls.clear();
  note = n; undo = []; redo = []; updUndo(); sel.clear();
  upgradeNote(n);
  n.audios = n.audios.filter(a => a.blob || a.file); // drop recordings interrupted by a reload
  for (const a of n.audios) a.recording = false;
  $('#title').value = n.title; $('#title').placeholder = n.media ? n.media.name : 'Untitled note';
  document.body.classList.toggle('child', navStack.length > 0);
  ov.innerHTML = ''; closePop();
  n.boxes.forEach(renderBox); n.audios.forEach(renderAudio); n.embeds.forEach(renderEmbed);
  renderMediaBackground(n);
  if (!keepView) { const fit = (scroller.clientWidth - 16) / PAGE_W; zoom = n.media ? Math.min(fit, 1.4) : (fit >= 0.7 ? Math.min(fit, 1.4) : 1); }
  layout(); updateSelUI(); if (!keepView) { scroller.scrollTop = 0; scroller.scrollLeft = 0; }
}
$('#title').addEventListener('input', () => { note.title = $('#title').value; save(); });
$('#title').addEventListener('change', refreshList);
$('#menuBtn').addEventListener('click', () => { refreshList(); renderSyncPanel(); document.body.classList.toggle('drawer'); });
$('#scrim').addEventListener('click', () => document.body.classList.remove('drawer'));
$('#newBtn').addEventListener('click', () => { newNote(); document.body.classList.remove('drawer'); });

/* ---------- sync: a private GitHub repo holds one JSON per note plus the audio files ----------
   notes/<id>.json  — the note without blobs; audios carry a `file` path
   audio/<id>.<ext> — immutable once recorded, uploaded once
   Last-writer-wins on `updated`. Each device remembers the sha of every remote file it has
   seen (so pulls fetch only what changed) and the `updated` it last pushed per note. */
const SYNC_KEY = 'notes:sync';
const API = localStorage.getItem('notes:apibase') || 'https://api.github.com';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
sync.shas ||= {}; sync.pushed ||= {}; sync.repo ||= 'notes-data';
const saveSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} };
let syncBusy = false, pushT = null, syncState = sync.token ? 'idle' : 'off', syncMsg = '';
function setSync(state, msg) { syncState = state; syncMsg = msg || ''; const b = $('#syncBtn'); b.dataset.state = state; b.title = msg || { off: 'Sync across devices', idle: 'Synced', syncing: 'Syncing…', error: 'Sync error' }[state]; if (document.body.classList.contains('drawer')) renderSyncPanel(); }
const extFor = mime => /mp4|m4a|aac/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm';
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const utf8b64 = str => b64(new TextEncoder().encode(str));

async function gh(method, path, body, raw) {
  const r = await fetch(API + path, {
    method, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + sync.token, Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error('GitHub rejected the token (' + r.status + ')'), { auth: true, status: r.status });
  if (!r.ok) throw Object.assign(new Error('GitHub ' + r.status + (await r.text().catch(() => '')).slice(0, 140)), { status: r.status });
  if (r.status === 204) return null;
  return raw ? r : r.json();
}
const repoPath = () => `/repos/${sync.owner}/${sync.repo}/contents/`;
const notePath = n => `notes/${n.id}.json`;
const allAudios = n => [...n.audios, ...(n.archive || []).filter(a => a.kind === 'audio').map(a => a.item)];
const mediaPath = n => n.media.file || `media/${n.id}.${mediaExt(n)}`;
const audioPath = a => a.file || `audio/${a.id}.${extFor(a.mime || (a.blob && a.blob.type) || '')}`;
const stripAudio = a => { const { blob, recording, synced, ...rest } = a; return { ...rest, file: audioPath(a) }; };
function remoteForm(n) {
  return { ...n, audios: n.audios.map(stripAudio),
    archive: (n.archive || []).map(x => x.kind === 'audio' ? { ...x, item: stripAudio(x.item) } : x),
    media: n.media ? (({ blob, synced, ...rest }) => ({ ...rest, file: mediaPath(n) }))(n.media) : null };
}

async function ensureRepo() {
  if (!sync.owner) { const me = await gh('GET', '/user'); sync.owner = me.login; saveSync(); }
  try { await gh('GET', `/repos/${sync.owner}/${sync.repo}`); return; }
  catch (e) { if (e.status !== 404) throw e; }
  try { await gh('POST', '/user/repos', { name: sync.repo, private: true, auto_init: true, description: 'notes page — synced notes (written by the notes app)' }); }
  catch (e) { throw new Error(`Repo ${sync.owner}/${sync.repo} not found and the token can't create it — create a private repo with that name, or use a classic token with the "repo" scope.`); }
}
async function putFile(path, contentB64, sha, msg) {
  const r = await gh('PUT', repoPath() + path, { message: msg, content: contentB64, ...(sha ? { sha } : {}) });
  sync.shas[path] = r.content.sha; saveSync(); return r.content.sha;
}
async function remoteSha(path) { try { const m = await gh('GET', repoPath() + path); return m.sha; } catch (e) { if (e.status === 404) return null; throw e; } }

async function fetchAudio(a) { // download a recording from the repo into the open note
  if (!sync.token || !a.file) throw new Error('not synced');
  const r = await gh('GET', repoPath() + a.file, null, true);
  a.blob = await r.blob(); a.synced = true;
  if (!a.blob.type || a.blob.type === 'application/octet-stream') a.blob = new Blob([a.blob], { type: a.mime || 'audio/mp4' });
  await saveNow(); return true;
}

async function fetchMedia(n) {
  if (!sync.token || !n.media || !n.media.file) throw new Error('not synced');
  const r = await gh('GET', repoPath() + n.media.file, null, true);
  n.media.blob = new Blob([await r.blob()], { type: n.media.type || 'application/octet-stream' }); n.media.synced = true;
  if (note && note.id === n.id) await saveNow(); else await DB.put(n);
  return true;
}
async function pushNote(n) {
  if (n.media && n.media.blob && !n.media.synced) {
    const path = mediaPath(n);
    if (!sync.shas[path]) { const sha = await remoteSha(path); if (sha) sync.shas[path] = sha; }
    if (!sync.shas[path]) await putFile(path, b64(new Uint8Array(await n.media.blob.arrayBuffer())), null, 'media ' + n.media.name);
    n.media.file = path; n.media.synced = true;
  }
  for (const a of allAudios(n)) if (a.blob && !a.synced) {
    const path = audioPath(a);
    if (!sync.shas[path]) { const sha = await remoteSha(path); if (sha) sync.shas[path] = sha; }
    if (!sync.shas[path]) await putFile(path, b64(new Uint8Array(await a.blob.arrayBuffer())), null, 'audio ' + a.id);
    a.file = path; a.synced = true;
  }
  const path = notePath(n), content = utf8b64(JSON.stringify(remoteForm(n)));
  try { await putFile(path, content, sync.shas[path], (n.title || 'untitled') + ' @ ' + new Date(n.updated).toISOString()); }
  catch (e) {
    if (e.status !== 409 && e.status !== 422) throw e;
    const sha = await remoteSha(path);               // someone else wrote it: compare and resolve
    const remote = sha ? await (await gh('GET', repoPath() + path, null, true)).json() : null;
    if (remote && remote.updated > n.updated) { await adoptRemote(remote, sha); return; }
    await putFile(path, content, sha, 'merge ' + n.id);
  }
  sync.pushed[n.id] = n.updated; saveSync();
}
async function adoptRemote(remote, sha) {
  const local = await DB.get(remote.id);
  const findLocal = id => local && allAudios(local).find(x => x.id === id);
  const merged = { ...remote,
    audios: remote.audios.map(a => ({ ...a, blob: findLocal(a.id)?.blob || null, synced: true })),
    archive: (remote.archive || []).map(x => x.kind === 'audio' ? { ...x, item: { ...x.item, blob: findLocal(x.item.id)?.blob || null, synced: true } } : x),
    media: remote.media ? { ...remote.media, blob: local && local.media && local.media.blob || null, synced: true } : null };
  await DB.put(merged);
  sync.shas[notePath(remote)] = sha; sync.pushed[remote.id] = remote.updated; saveSync();
  if (note && note.id === merged.id) {
    if (act || recording || note.updated > merged.updated) return;  // mid-stroke: leave it, next pull will catch up
    loadNote(merged, true);
  }
}
async function remoteDelete(n) {
  if (!sync.token) return;
  try {
    for (const p of [notePath(n), ...allAudios(n).map(audioPath), ...(n.media ? [mediaPath(n)] : [])]) {
      const sha = sync.shas[p] || await remoteSha(p);
      if (sha) await gh('DELETE', repoPath() + p, { message: 'delete ' + p, sha });
      delete sync.shas[p];
    }
    delete sync.pushed[n.id]; saveSync();
  } catch (e) { setSync('error', e.message); }
}

async function syncAll(reason) {
  if (!sync.token || syncBusy || !navigator.onLine) return;
  syncBusy = true; setSync('syncing');
  try {
    await ensureRepo();
    if (note) await saveNow();
    // --- pull ---
    let list = [];
    try { list = await gh('GET', repoPath() + 'notes'); } catch (e) { if (e.status !== 404) throw e; }
    const remoteIds = new Set();
    for (const f of list) {
      if (!f.name.endsWith('.json')) continue;
      const id = f.name.slice(0, -5); remoteIds.add(id);
      if (sync.shas[f.path] === f.sha) continue;
      const remote = await (await gh('GET', repoPath() + f.path, null, true)).json();
      const local = await DB.get(id);
      if (!local || remote.updated > local.updated) await adoptRemote(remote, f.sha);
      else { sync.shas[f.path] = f.sha; if (local.updated > remote.updated) delete sync.pushed[id]; saveSync(); } // ours is newer: push below
    }
    // --- reconcile deletions & push ---
    for (const n of await DB.all()) {
      if (!remoteIds.has(n.id) && sync.pushed[n.id]) { // we pushed it before and it's gone remotely: deleted elsewhere
        await DB.del(n.id); delete sync.pushed[n.id]; delete sync.shas[notePath(n)]; saveSync();
        if (note && note.id === n.id) { const rest = (await DB.all()).sort((a, b) => b.updated - a.updated); rest.length ? loadNote(rest[0], true) : await newNote(); }
        continue;
      }
      if (n.updated > (sync.pushed[n.id] || 0) && !isEmptyNote(n)) await pushNote(n);
    }
    sync.syncedAt = Date.now(); saveSync();
    setSync('idle', 'Synced ' + new Date(sync.syncedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    if (document.body.classList.contains('drawer')) refreshList();
  } catch (e) {
    setSync('error', e.message);
    if (e.auth) toast('Sync: ' + e.message);
  } finally { syncBusy = false; }
}
const isEmptyNote = n => !n.title && !n.strokes.length && !n.boxes.length && !n.audios.length && !(n.embeds || []).length && !n.media;
function schedulePush(ms = 6000) { if (!sync.token) return; clearTimeout(pushT); pushT = setTimeout(() => syncAll('push'), ms); }

function renderSyncPanel() {
  const el = $('#syncPanel');
  if (!sync.token) {
    el.innerHTML = `<b>Sync across devices</b>
      <p class="muted">Notes and recordings are kept in a private GitHub repo on your account (<code>notes-data</code>, created for you). Each device connects once with a token.</p>
      <p class="muted">1. <a href="https://github.com/settings/tokens/new?scopes=repo&description=notes%20page" target="_blank" rel="noopener">Create a token</a> with the <b>repo</b> scope (no expiry is easiest).<br>2. Paste it here, and on your other devices.</p>
      <input id="stoken" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false">
      <div class="row"><button class="btn" id="sconnect">Connect</button>${syncMsg ? `<span class="err">${esc(syncMsg)}</span>` : ''}</div>`;
    const go = () => { const tok = el.querySelector('#stoken').value.trim(); if (!tok) return; sync = { token: tok, repo: 'notes-data', shas: {}, pushed: {} }; saveSync(); setSync('idle'); syncAll('connect'); };
    el.querySelector('#sconnect').addEventListener('click', go);
    el.querySelector('#stoken').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  } else {
    const link = sync.owner ? `<a href="https://github.com/${esc(sync.owner)}/${esc(sync.repo)}" target="_blank" rel="noopener">${esc(sync.owner)}/${esc(sync.repo)}</a>` : esc(sync.repo);
    el.innerHTML = `<b>Sync</b>
      <p>${syncState === 'error' ? `<span class="err">${esc(syncMsg)}</span>` : syncState === 'syncing' ? 'Syncing…' : (sync.syncedAt ? 'Synced ' + fmtD(sync.syncedAt) : 'Connected')} · ${link}</p>
      <div class="row"><button class="lnk" id="ssync">Sync now</button><button class="lnk" id="sdisc">Disconnect this device</button></div>`;
    el.querySelector('#ssync').addEventListener('click', () => syncAll('manual'));
    el.querySelector('#sdisc').addEventListener('click', () => { if (!confirm('Disconnect? Notes stay on this device and in the repo.')) return; sync = { repo: sync.repo, shas: {}, pushed: {} }; saveSync(); setSync('off'); renderSyncPanel(); });
  }
}
$('#syncBtn').addEventListener('click', () => { if (sync.token) syncAll('manual'); refreshList(); document.body.classList.add('drawer'); renderSyncPanel(); });
window.addEventListener('online', () => schedulePush(500));
document.addEventListener('visibilitychange', () => { if (!document.hidden) schedulePush(300); });
setInterval(() => { if (!document.hidden) syncAll('tick'); }, 90000);

/* export / import (audio embedded as base64) */
const b2b64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
$('#exportBtn').addEventListener('click', async () => {
  const out = JSON.parse(JSON.stringify({ ...note, audios: [] }));
  for (const a of note.audios) if (a.blob) out.audios.push({ ...a, blob: null, data: await b2b64(a.blob), type: a.blob.type });
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = (note.title || 'note') + '.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 5000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async () => {
  const f = $('#importFile').files[0]; if (!f) return;
  if (!/\.json$/i.test(f.name)) { const n = await importMedia(f, false); $('#importFile').value = ''; if (n) { navStack = []; openNote(n.id); document.body.classList.remove('drawer'); } return; }
  try {
    const n = JSON.parse(await f.text()); n.id = uid(); n.updated = Date.now();
    for (const a of n.audios || []) { if (a.data) { const bin = atob(a.data); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); a.blob = new Blob([u8], { type: a.type || 'audio/webm' }); delete a.data; } a.id = uid(); }
    n.strokes ||= []; n.boxes ||= []; n.audios ||= []; n.pageH ||= 1600;
    await DB.put(n); openNote(n.id); document.body.classList.remove('drawer'); toast('Imported');
  } catch (e) { toast('Import failed: ' + e.message); }
  $('#importFile').value = '';
});

/* ---------- update check: a home-screen web app keeps its loaded page until relaunched ----------
   Each time the app comes to the foreground, compare the site's copy of this page with the one running. */
const APP_BUILD = document.lastModified;
let updateShown = false;
async function checkForUpdate() {
  if (updateShown || !navigator.onLine) return;
  try {
    const r = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
    const lm = r.headers.get('last-modified'); if (!lm) return;
    const remote = Date.parse(lm), local = Date.parse(APP_BUILD);
    if (!isNaN(remote) && !isNaN(local) && remote > local + 60000) {
      updateShown = true;
      toast('A newer version of Notes is available', 'Reload', async () => { if (note) await saveNow(); location.reload(); });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
setTimeout(checkForUpdate, 4000);

/* ---------- boot ---------- */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { buildPop(); drawAll(); });
window.addEventListener('resize', () => { if (note) commitZoom(); });
window.addEventListener('pagehide', () => { if (recording) stopRec(); if (note) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && note) saveNow(); });
document.addEventListener('click', e => { if (!e.target.closest('#pop') && !e.target.closest('[data-tool=pen]')) $('#pop').classList.remove('open'); });

(async () => {
  buildPop(); setTool('pen'); updUndo();
  const last = localStorage.getItem('notes:last');
  let n = last && await DB.get(last);
  if (!n) { const all = (await DB.all()).filter(x => !x.archived).sort((a, b) => b.updated - a.updated); n = all[0]; }
  if (n) loadNote(n); else { n = blankNote(); await DB.put(n); loadNote(n); }
  refreshList(); setSync(sync.token ? 'idle' : 'off');
  if (sync.token) syncAll('boot');
})();
})();
</script>
