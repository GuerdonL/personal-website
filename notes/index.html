<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7e5e4; --paper: #ffffff; --t0: #ffffff; --t1: #f5f5f4;
    --line: #e7e5e4; --line-strong: #a8a29e;
    --ink: #292524; --faint: #a8a29e; --accent: #57534e; --danger: #dc2626;
    --sel: #2563eb; --ok: #16a34a; --match: #ca8a04;
    --rule: #eef0f3; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06);
    --pen-ink: #1c1917;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141211; --paper: #1f1c1a; --t0: #292524; --t1: #221f1d;
      --line: #3a3532; --line-strong: #78716c;
      --ink: #e7e5e4; --faint: #78716c; --accent: #d6d3d1; --danger: #f87171;
      --sel: #60a5fa; --ok: #4ade80; --match: #facc15;
      --rule: #2a2624; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
      --pen-ink: #f5f5f4;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.35 Inter, system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { display: block; }

  /* ---------- top bar ---------- */
  #bar {
    flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px;
    background: var(--t0); border-bottom: 1px solid var(--line);
    z-index: 20; position: relative;
  }
  #bar .ib {
    width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
    color: var(--accent); flex: none;
  }
  #bar .ib:hover { background: var(--t1); }
  #bar .ib.on { background: var(--ink); color: var(--t0); }
  #bar .ib:disabled { opacity: .35; cursor: default; }
  #fingerBtn { position: relative; }
  #fingerBtn[data-mode=penonly]::after { content: ''; position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  #bar .ib svg { width: 20px; height: 20px; }
  #title {
    flex: 1 1 140px; min-width: 80px; height: 36px; border: 0; background: transparent;
    font: 500 15px Inter, system-ui, sans-serif; color: var(--ink); outline: none;
    padding: 0 6px; border-radius: 8px;
  }
  #title:focus { background: var(--t1); }
  .grp { display: flex; align-items: center; gap: 2px; }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  #recpill {
    display: none; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 10px;
    border-radius: 16px; background: #fee2e2; color: #991b1b; font: 12px/1 'JetBrains Mono', ui-monospace, monospace;
  }
  #recpill.on { display: inline-flex; }
  #recpill .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; animation: blink 1s infinite; }
  #recpill button { height: 24px; padding: 0 10px; border-radius: 12px; background: #991b1b; color: #fff; font: 500 12px Inter, system-ui, sans-serif; }
  @keyframes blink { 50% { opacity: .25; } }

  /* color + width popover */
  #pop {
    position: absolute; top: 100%; z-index: 30; margin-top: 4px;
    background: var(--t0); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 8px; display: none; gap: 10px; align-items: center;
  }
  #pop.open { display: flex; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; display: grid; place-items: center; }
  .sw i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .sw.on { border-color: var(--sel); }
  .wd { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .wd.on { background: var(--t1); }
  .wd i { background: var(--ink); border-radius: 50%; display: block; }

  /* ---------- drawer ---------- */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 40; display: none; }
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); z-index: 41;
    background: var(--t0); border-right: 1px solid var(--line);
    transform: translateX(-100%); transition: transform .18s ease-out;
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px);
  }
  body.drawer #drawer { transform: none; }
  body.drawer #scrim { display: block; }
  #drawer header { display: flex; align-items: center; padding: 12px 12px 8px; gap: 8px; }
  #drawer header b { font-weight: 500; flex: 1; }
  #drawer .new { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--ink); color: var(--t0); font-weight: 500; }
  #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 8px 20px; }
  .it {
    display: flex; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 8px; cursor: pointer;
  }
  .it:hover { background: var(--t1); }
  .it.cur { background: var(--t1); box-shadow: inset 3px 0 0 var(--sel); }
  .it .m { flex: 1; min-width: 0; }
  .it .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .d { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); margin-top: 2px; }
  .it .del { color: var(--faint); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .it .del:hover { color: var(--danger); background: var(--t0); }
  #drawer footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; }
  #drawer footer button { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  /* ---------- page ---------- */
  #scroller {
    flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
    position: relative; overscroll-behavior: contain;
  }
  #wrap { margin: 0 auto; position: relative; }
  #layer {
    position: absolute; left: 0; top: 0; width: 1000px; transform-origin: 0 0;
    background: var(--paper);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 32px; background-position: 0 31px;
    box-shadow: var(--shadow);
  }
  #cv { position: absolute; left: 0; top: 0; width: 1000px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv.pen { cursor: crosshair; }
  #cv.text { cursor: cell; }
  #cv.hand { cursor: grab; }
  #cv.eraser { cursor: cell; }
  #ov { position: absolute; left: 0; top: 0; width: 1000px; height: 100%; pointer-events: none; }
  #ov > * { pointer-events: auto; }
  #marq { position: absolute; border: 1px dashed var(--sel); background: rgba(37,99,235,.06); display: none; pointer-events: none; }
  #more {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: grid; place-items: center;
    color: var(--faint); font-size: 12px; pointer-events: auto;
  }
  #more:hover { color: var(--accent); }

  /* text boxes & audio cards */
  .tb, .ac {
    position: absolute; background: var(--t0); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); min-width: 120px;
  }
  .tb.sel, .ac.sel { border-color: var(--sel); box-shadow: 0 0 0 2px rgba(37,99,235,.2); }
  .grip {
    display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 8px;
    color: var(--faint); font: 11px 'JetBrains Mono', ui-monospace, monospace;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; background: var(--t1);
  }
  .grip .sp { flex: 1; }
  .grip .x { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--faint); }
  .grip .x:hover { color: var(--danger); }
  .grip .x svg { width: 12px; height: 12px; }
  .tb textarea {
    display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    font: 15px/1.45 Inter, system-ui, sans-serif; padding: 8px 10px; min-height: 48px; overflow: hidden;
  }
  .rz {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 55%, var(--line-strong) 55%, var(--line-strong) 65%, transparent 65%, transparent 80%, var(--line-strong) 80%, var(--line-strong) 90%, transparent 90%);
    border-radius: 0 0 8px 0;
  }

  .ac { width: 360px; max-width: 920px; }
  .ac .grip .rec { color: #dc2626; display: inline-flex; align-items: center; gap: 5px; }
  .ac .grip .rec::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #dc2626; animation: blink 1s infinite; }
  .ac .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .ac .ctl { display: flex; align-items: center; gap: 8px; }
  .ac .play { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--t0); display: grid; place-items: center; flex: none; }
  .ac .play svg { width: 14px; height: 14px; }
  .ac .seek { flex: 1; accent-color: var(--ink); height: 20px; margin: 0; touch-action: none; }
  .ac .time { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); flex: none; min-width: 72px; text-align: right; }
  .ac .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
  .ac .meta a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .ac .meta a:hover { text-decoration: underline; }
  .ac .meta svg { width: 13px; height: 13px; }
  .ac .tabs { display: flex; gap: 2px; background: var(--t1); border-radius: 6px; padding: 2px; align-self: flex-start; }
  .ac .tabs button { height: 24px; padding: 0 10px; border-radius: 5px; font-size: 12px; color: var(--faint); }
  .ac .tabs button.on { background: var(--t0); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ac .tx { font-size: 14px; line-height: 1.5; }
  .ac .tx textarea {
    display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink);
    font: 14px/1.5 Inter, system-ui, sans-serif; padding: 6px 8px; resize: none; overflow: hidden; outline: none; min-height: 40px;
  }
  .ac .tx textarea:focus { border-color: var(--line-strong); }
  .ac .lines { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ac .ln { display: flex; gap: 8px; padding: 3px 6px; border-radius: 5px; cursor: pointer; align-items: baseline; }
  .ac .ln:hover { background: var(--t1); }
  .ac .ln.cur { background: #fef9c3; color: #292524; }
  @media (prefers-color-scheme: dark) { .ac .ln.cur { background: #3f3a1d; color: #fef08a; } }
  .ac .ln .t { font: 11px 'JetBrains Mono', ui-monospace, monospace; color: var(--faint); flex: none; width: 38px; }
  .ac .ln .w { flex: 1; outline: none; }
  .ac .ln .w:focus { background: var(--t0); box-shadow: 0 0 0 1px var(--line-strong); border-radius: 3px; }
  .ac .interim { color: var(--faint); font-style: italic; }
  .ac .empty { color: var(--faint); font-size: 12px; font-style: italic; }
  .ac .live { display: flex; flex-direction: column; gap: 6px; }
  .ac .stop { height: 32px; padding: 0 14px; border-radius: 8px; background: #991b1b; color: #fff; font-weight: 500; align-self: flex-start; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--t0); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
    transition: .18s; pointer-events: none; z-index: 60; max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 520px) {
    #bar { gap: 2px; padding-left: 6px; padding-right: 6px; }
    #bar .ib { width: 34px; }
    #title { flex-basis: 100%; order: -1; height: 32px; }
    .sep { margin: 0 2px; }
  }
</style>
</head>
<body>

<header id="bar">
  <button class="ib" id="menuBtn" title="Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <input id="title" placeholder="Untitled note" spellcheck="false">
  <div class="grp" id="tools">
    <button class="ib" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></button>
    <button class="ib" data-tool="hl" title="Highlighter (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
    <button class="ib" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a2 2 0 0 1 0-2.8l9.2-9.2a2 2 0 0 1 2.8 0l5.2 5.2a2 2 0 0 1 0 2.8L13 19"/><path d="M6 11l7 7"/></svg></button>
    <button class="ib" data-tool="text" title="Text box (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M12 9v7"/></svg></button>
    <button class="ib" data-tool="hand" title="Move / select (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.9-2.3l-4-4A2 2 0 0 1 5 12.9l1 .7"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="ib" id="fingerBtn" title="Finger draws (otherwise finger pans)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="M8 7l4 4 4-4"/><path d="M6 14a6 6 0 0 0 12 0v-2"/></svg></button>
    <button class="ib" id="undoBtn" title="Undo (⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
    <button class="ib" id="redoBtn" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="ib" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button>
    <button class="ib" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg></button>
  </div>
  <div class="sep"></div>
  <button class="ib" id="recBtn" title="Record audio (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button>
  <div id="recpill"><span class="dot"></span><span id="recTime">0:00</span><button id="recStop">Stop</button></div>
  <div id="pop">
    <div class="grp" id="colors"></div>
    <div class="sep"></div>
    <div class="grp" id="widths"></div>
  </div>
</header>

<div id="scrim"></div>
<aside id="drawer">
  <header><b>Notes</b><button class="new" id="newBtn">+ New</button></header>
  <div id="list"></div>
  <footer><button id="exportBtn">Export this note (JSON)</button><button id="importBtn">Import</button><input type="file" id="importFile" accept="application/json" hidden></footer>
</aside>

<main id="scroller">
  <div id="wrap">
    <div id="layer">
      <canvas id="cv"></canvas>
      <div id="ov"></div>
      <div id="marq"></div>
      <button id="more">+ more space</button>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const PAGE_W = 1000;
const COLORS = { ink: null, blue: '#2563eb', red: '#dc2626', green: '#16a34a', orange: '#ea580c' };
const HL = '#facc15';
const WIDTHS = [1.6, 2.6, 4.2];
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const now = () => performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtD = ts => new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inkColor = () => getComputedStyle(document.documentElement).getPropertyValue('--pen-ink').trim();

let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); };

/* ---------- storage ---------- */
const DB = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('notes-app', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('notes', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('notes', mode); const q = fn(t.objectStore('notes')); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };
  return {
    all: () => tx('readonly', s => s.getAll()),
    get: id => tx('readonly', s => s.get(id)),
    put: n => tx('readwrite', s => s.put(n)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();
const blankNote = () => ({ id: uid(), title: '', created: Date.now(), updated: Date.now(), pageH: 1600, strokes: [], boxes: [], audios: [] });

/* ---------- state ---------- */
let note = null;
let zoom = 1, tool = 'pen', color = 'ink', width = 1, penSeen = false;
let touchMode = localStorage.getItem('notes:touch') || 'pan'; // 'pan' | 'draw' | 'penonly'
let undo = [], redo = [];
const scroller = $('#scroller'), wrap = $('#wrap'), layer = $('#layer'), cv = $('#cv'), ov = $('#ov'), ctx = cv.getContext('2d');
const urls = new Map(); // audio id -> object URL

let saveT;
const save = () => { if (!note) return; note.updated = Date.now(); clearTimeout(saveT); saveT = setTimeout(() => DB.put(note).catch(e => toast('Save failed: ' + e.message)), 400); };
const saveNow = () => { if (!note) return; clearTimeout(saveT); return DB.put(note); };

/* ---------- layout / zoom ---------- */
function layout(redraw = true) {
  wrap.style.width = PAGE_W * zoom + 'px';
  wrap.style.height = note.pageH * zoom + 'px';
  layer.style.height = note.pageH + 'px';
  layer.style.transform = `scale(${zoom})`;
  ov.style.height = note.pageH + 'px';
  if (redraw) sizeCanvas();
}
function sizeCanvas() {
  const factor = Math.min(zoom * DPR, Math.sqrt(14e6 / (PAGE_W * note.pageH)));
  cv.style.height = note.pageH + 'px';
  cv.width = Math.round(PAGE_W * factor); cv.height = Math.round(note.pageH * factor);
  cv._f = factor;
  drawAll();
}
function setZoom(z, cx, cy) { // keep the layer point under client (cx,cy) fixed

      tx.innerHTML = `<div class="lines">${a.lines.map((l, i) => `<div class="ln" data-i="${i}"><span class="t">${fmtT(l.t)}</span><span class="w" contenteditable="true" spellcheck="false">${esc(l.text)}</span></div>`).join('')}</div>`;
      if (!a.lines.length) tx.innerHTML = `<div class="empty">Transcript has no timed lines.</div>`;
      tx.querySelectorAll('.ln').forEach(ln => {
        const i = +ln.dataset.i, w = ln.querySelector('.w');
        ln.querySelector('.t').addEventListener('click', () => { audio.currentTime = a.lines[i].t; audio.play(); });
        ln.addEventListener('dblclick', e => { if (e.target !== w) { audio.currentTime = a.lines[i].t; audio.play(); } });
        w.addEventListener('input', () => { a.lines[i].text = w.textContent; a.editedText = null; save(); });
        w.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); w.blur(); } });
      });
    } else {
      tx.innerHTML = `<textarea spellcheck="false"></textarea>`;
      const ta = tx.querySelector('textarea'); ta.value = transcriptText(a); autoH(ta);
      ta.addEventListener('input', () => { a.editedText = ta.value; autoH(ta); save(); });
    }
  }
  function highlight(t) {
    let cur = -1; a.lines.forEach((l, i) => { if (l.t <= t + 0.05) cur = i; });
    tx.querySelectorAll('.ln').forEach((ln, i) => {
      const on = i === cur; if (on && !ln.classList.contains('cur')) ln.scrollIntoView({ block: 'nearest' });
      ln.classList.toggle('cur', on);
    });
  }
  setMode(a.mode || 'single');
}

/* recording */
let recording = null; // {a, el, rec, stream, chunks, t0, timer, sr, srOffset, srLen, seg}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
async function startRec() {
  if (recording) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast('Microphone access denied'); return; }
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  const r = scroller.getBoundingClientRect();
  const p = toLayer(r.left + r.width / 2, r.top + 60);
  const a = { id: uid(), created: Date.now(), x: clamp(Math.round(p.x - 180), 0, PAGE_W - 360), y: Math.max(0, Math.round(p.y)), w: 360, duration: 0, mime, blob: null, location: null, lines: [], editedText: null, mode: 'single', recording: true };
  note.audios.push(a);
  const el = renderAudio(a);
  deselectAll(); el.classList.add('sel');
  let rec; try { rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); } catch (e) { stream.getTracks().forEach(t => t.stop()); note.audios.pop(); el.remove(); toast('Recording not supported in this browser'); return; }
  const R = recording = { a, el, rec, stream, chunks: [], t0: now(), seg: new Map(), srOffset: 0, srLen: 0, interim: '' };
  rec.ondataavailable = e => { if (e.data.size) R.chunks.push(e.data); };
  rec.onstop = finishRec;
  rec.start(1000);
  R.timer = setInterval(() => { const s = (now() - R.t0) / 1000; $('#recTime').textContent = fmtT(s); const d = el.querySelector('.dur'); if (d) d.textContent = fmtT(s); }, 250);
  $('#recpill').classList.add('on'); $('#recBtn').classList.add('on');

  // location
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      a.location = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      const l = el.querySelector('.locs'); if (l) l.textContent = `📍 ${a.location.lat.toFixed(4)}, ${a.location.lng.toFixed(4)}`;
      save();
    }, err => { const l = el.querySelector('.locs'); if (l) l.textContent = 'no location (' + (err.code === 1 ? 'denied' : 'unavailable') + ')'; }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
  } else { const l = el.querySelector('.locs'); if (l) l.textContent = 'no location'; }

  // live transcription
  if (SR) startSR(R); else { const i = el.querySelector('.interim'); if (i) i.textContent = 'Live transcription not supported in this browser.'; }
  save();
}
function startSR(R) {
  const sr = R.sr = new SR();
  sr.continuous = true; sr.interimResults = true; sr.lang = navigator.language || 'en-US';
  const linesEl = () => R.el.querySelector('.lines'), interimEl = () => R.el.querySelector('.interim');
  sr.onresult = e => {
    const t = (now() - R.t0) / 1000;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const key = R.srOffset + i, res = e.results[i], text = res[0].transcript.trim();
      if (!R.seg.has(key)) R.seg.set(key, { t: Math.max(0, t - 1.2), done: false, text });
      const s = R.seg.get(key); s.text = text;
      if (res.isFinal && !s.done && text) { s.done = true; R.a.lines.push({ t: +s.t.toFixed(1), text }); const le = linesEl(); if (le) { le.insertAdjacentHTML('beforeend', `<div class="ln"><span class="t">${fmtT(s.t)}</span><span class="w">${esc(text)}</span></div>`); le.scrollTop = le.scrollHeight; } }
      else if (!res.isFinal) interim += text + ' ';
    }
    R.srLen = e.results.length; R.interim = interim;
    const ie = interimEl(); if (ie) ie.textContent = interim;
  };
  sr.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { R.srDead = true; const ie = interimEl(); if (ie) ie.textContent = 'Live transcription unavailable (' + e.error + ').'; } };
  sr.onend = () => {
    // flush any interim segments that never finalized
    for (const [k, s] of R.seg) if (!s.done && s.text) { s.done = true; R.a.lines.push({ t: +s.t.toFixed(1), text: s.text }); }
    R.srOffset += R.srLen; R.srLen = 0; R.interim = '';
    if (recording === R && !R.srDead) { try { sr.start(); } catch (e) {} }
  };
  try { sr.start(); } catch (e) { const ie = interimEl(); if (ie) ie.textContent = 'Live transcription failed to start.'; }
}
function stopRec() {
  const R = recording; if (!R) return;
  R.a.duration = (now() - R.t0) / 1000;
  clearInterval(R.timer);
  $('#recpill').classList.remove('on'); $('#recBtn').classList.remove('on');
  if (R.sr) { try { R.sr.stop(); } catch (e) {} }
  if (R.rec.state !== 'inactive') R.rec.stop(); else finishRec();
}
function finishRec() {
  const R = recording; if (!R) return;
  recording = null;
  R.stream.getTracks().forEach(t => t.stop());
  const a = R.a;
  a.blob = new Blob(R.chunks, { type: R.rec.mimeType || a.mime || 'audio/webm' });
  a.lines.sort((x, y) => x.t - y.t);
  a.recording = false;
  // give the recognizer's onend a moment to flush, then render
  setTimeout(() => { a.lines.sort((x, y) => x.t - y.t); fillAudio(R.el, a); growPage(a.y + R.el.offsetHeight + 200); save(); }, 350);
}
$('#recBtn').addEventListener('click', () => recording ? stopRec() : startRec());
$('#recStop').addEventListener('click', stopRec);

/* ---------- notes list ---------- */
async function refreshList() {
  const all = (await DB.all()).sort((a, b) => b.updated - a.updated);
  const list = $('#list'); list.innerHTML = '';
  for (const n of all) {
    const it = document.createElement('div'); it.className = 'it' + (note && n.id === note.id ? ' cur' : '');
    const bits = [n.strokes.length && `${n.strokes.length} strokes`, n.boxes.length && `${n.boxes.length} text`, n.audios.length && `${n.audios.length} audio`].filter(Boolean).join(' · ');
    it.innerHTML = `<div class="m"><div class="n">${esc(n.title || 'Untitled note')}</div><div class="d">${fmtD(n.updated)}${bits ? ' · ' + bits : ''}</div></div><button class="del" title="Delete">${X}</button>`;
    it.addEventListener('click', e => { if (e.target.closest('.del')) return; openNote(n.id); document.body.classList.remove('drawer'); });
    it.querySelector('.del').addEventListener('click', async () => {
      if (!confirm(`Delete "${n.title || 'Untitled note'}"? This can't be undone.`)) return;
      await DB.del(n.id);
      if (note && note.id === n.id) { const rest = (await DB.all()).sort((a, b) => b.updated - a.updated); rest.length ? await openNote(rest[0].id) : await newNote(); }
      refreshList();
    });
    list.appendChild(it);
  }
}
async function openNote(id) {
  if (recording) stopRec();
  if (note) await saveNow();
  const n = await DB.get(id); if (!n) return;
  loadNote(n);
  localStorage.setItem('notes:last', id);
  refreshList();
}
async function newNote() {
  if (recording) stopRec();
  if (note) await saveNow();
  const n = blankNote(); await DB.put(n); loadNote(n);
  localStorage.setItem('notes:last', n.id); refreshList();
  $('#title').focus();
}
function loadNote(n) {
  for (const u of urls.values()) URL.revokeObjectURL(u); urls.clear();
  note = n; undo = []; redo = []; updUndo();
  n.audios = n.audios.filter(a => a.blob); // drop recordings interrupted by a reload
  for (const a of n.audios) a.recording = false;
  $('#title').value = n.title;
  ov.innerHTML = '';
  n.boxes.forEach(renderBox); n.audios.forEach(renderAudio);
  const fit = (scroller.clientWidth - 16) / PAGE_W;
  zoom = fit >= 0.7 ? Math.min(fit, 1.4) : 1;
  layout(); scroller.scrollTop = 0; scroller.scrollLeft = 0;
}
$('#title').addEventListener('input', () => { note.title = $('#title').value; save(); });
$('#title').addEventListener('change', refreshList);
$('#menuBtn').addEventListener('click', () => { refreshList(); document.body.classList.toggle('drawer'); });
$('#scrim').addEventListener('click', () => document.body.classList.remove('drawer'));
$('#newBtn').addEventListener('click', () => { newNote(); document.body.classList.remove('drawer'); });

/* export / import (audio embedded as base64) */
const b2b64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
$('#exportBtn').addEventListener('click', async () => {
  const out = JSON.parse(JSON.stringify({ ...note, audios: [] }));
  for (const a of note.audios) out.audios.push({ ...a, blob: null, data: await b2b64(a.blob), type: a.blob.type });
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = (note.title || 'note') + '.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 5000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async () => {
  const f = $('#importFile').files[0]; if (!f) return;
  try {
    const n = JSON.parse(await f.text()); n.id = uid(); n.updated = Date.now();
    for (const a of n.audios || []) { if (a.data) { const bin = atob(a.data); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); a.blob = new Blob([u8], { type: a.type || 'audio/webm' }); delete a.data; } a.id = uid(); }
    n.strokes ||= []; n.boxes ||= []; n.audios ||= []; n.pageH ||= 1600;
    await DB.put(n); openNote(n.id); document.body.classList.remove('drawer'); toast('Imported');
  } catch (e) { toast('Import failed: ' + e.message); }
  $('#importFile').value = '';
});

/* ---------- boot ---------- */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { buildPop(); drawAll(); });
window.addEventListener('resize', () => { if (note) commitZoom(); });
window.addEventListener('pagehide', () => { if (recording) stopRec(); if (note) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && note) saveNow(); });
document.addEventListener('click', e => { if (!e.target.closest('#pop') && !e.target.closest('[data-tool=pen]')) $('#pop').classList.remove('open'); });

(async () => {
  buildPop(); setTool('pen'); updUndo();
  const last = localStorage.getItem('notes:last');
  let n = last && await DB.get(last);
  if (!n) { const all = (await DB.all()).sort((a, b) => b.updated - a.updated); n = all[0]; }
  if (n) loadNote(n); else { n = blankNote(); await DB.put(n); loadNote(n); }
  refreshList();
})();
})();
</script>
</body>
